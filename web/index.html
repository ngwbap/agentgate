<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valio Aimo assistant</title>
<link rel="stylesheet" href="/shared.css?v=3">
<style>
  /* The request is the hero: what the kitchen needs, in its own words. */
  .ask { margin-top: 28px; border-radius: 16px; padding: 20px 22px 16px; border: 1px solid var(--line-strong); }
  .ask label.q { display: block; font-size: 26px; font-weight: 800; font-variation-settings: "wdth" 112; letter-spacing: -.015em; margin-bottom: 8px; }
  .ask textarea { width: 100%; min-height: 64px; resize: vertical; border: none; padding: 2px 0; font-size: 19px; line-height: 1.45; background: transparent; }
  .ask textarea::placeholder { color: var(--faint); }
  .ask textarea:focus-visible { outline: none; }
  .ask:focus-within { border-color: var(--accent); }
  .ask .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 12px; }
  .ask .hint { font-size: 13px; color: var(--muted); max-width: 52ch; }
  #mic { border-radius: 99px; padding: 8px 16px; }
  #mic.on { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

  /* Criteria: the boxes the agent will obey. Groups sit side by side on wide screens. */
  .crit { margin-top: 12px; padding: 18px 20px; }
  .crit .fields { display: grid; grid-template-columns: 2fr 1.4fr 1fr 1fr; gap: 12px; }
  .crit label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .crit .groups { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 6px 22px; margin-top: 16px; }
  .crit .group > .t { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .crit .group > .t .faint { font-weight: 400; }
  .crit .wide { grid-column: 1 / -1; }
  @media (max-width: 820px) { .crit .fields { grid-template-columns: 1fr 1fr; } .crit .groups { grid-template-columns: 1fr; } }
  .tick { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; padding: 5px 11px; border-radius: 4px; border: 1px solid var(--line-strong);
    cursor: pointer; margin: 0 6px 6px 0; user-select: none; background: var(--paper); }
  .tick input { margin: 0; accent-color: var(--accent); }
  .tick.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .req { color: var(--bad); }
  .wishes { margin: 0 0 6px; padding-left: 18px; font-size: 14px; }
  .crit .go { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line);
    margin-top: 14px; padding-top: 14px; }
  #find { padding: 10px 26px; font-size: 16px; }

  /* Plans: the status band is the one loud element. Green = Valio's own stock, amber = not guaranteed. */
  .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .plan { cursor: pointer; padding: 0; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); }
  .plan:hover { border-color: var(--line-strong); }
  .plan.sel { border: 2px solid var(--accent); }
  .plan .band { display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; }
  .plan .band.ok { background: var(--ok-soft); color: var(--ok); }
  .plan .band.warn { background: var(--warn-soft); color: var(--warn); }
  .plan .body { padding: 12px 14px 12px; }
  .plan .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .plan .label { font-size: 20px; font-weight: 800; font-variation-settings: "wdth" 115; letter-spacing: -.01em; }
  .plan.sel .label { color: var(--accent); }
  .plan .price { font-weight: 800; font-size: 20px; font-variation-settings: "wdth" 108; }
  .plan .what { margin: 6px 0 2px; font-size: 14px; color: var(--muted); min-height: 42px; }
  .plan .note { font-size: 12.5px; color: var(--muted); }
  .badge-top { margin-top: 6px; font-size: 12px; cursor: pointer; }
  .stars { white-space: nowrap; letter-spacing: 1px; font-size: 14px; }
  .stars + b { display: inline-block; min-width: 2.1em; text-align: right; font-variant-numeric: tabular-nums; }
  .crit-row > span:first-child { flex: 1; text-align: left; }
  .st { color: var(--line-strong); position: relative; display: inline-block; }
  .st.on { color: var(--star); }
  .st.half::before { content: "★"; position: absolute; left: 0; top: 0; width: 50%; overflow: hidden; color: var(--star); }
  .rating { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 6px; }
  .crit-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; padding: 3px 6px; border-radius: 4px;
    background: none; border: none; width: 100%; color: var(--ink); font-weight: 400; }
  .crit-row:hover, .crit-row.on { background: var(--ice-2); }
  .crit-row.inline { width: auto; border: 1px solid var(--line); padding: 2px 10px; }
  .explain { display: block; background: var(--ice-2); border-left: 4px solid var(--accent); border-radius: 0; padding: 12px 16px; margin-top: 12px; font-size: 14px; max-width: 80ch; }

  /* The draft order reads like a delivery docket: rows, hairlines, totals lined up on the right. */
  .docket { padding: 4px 18px; border-radius: 10px 10px 0 0; border-bottom: none; }
  .line { display: grid; grid-template-columns: 64px 1fr auto 110px; gap: 16px; align-items: center; padding: 16px 0; }
  .line + .line { border-top: 1px dashed var(--line-strong); }
  .line .name { font-weight: 700; font-size: 16px; }
  .line .meta { color: var(--faint); font-size: 12.5px; display: flex; gap: 12px; flex-wrap: wrap; }
  .line .total { font-weight: 800; text-align: right; font-size: 17px; }
  @media (max-width: 720px) { .line { grid-template-columns: 52px 1fr; } .line .qty, .line .total { grid-column: 2; text-align: left; } }
  .alts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .alts button { font-size: 12.5px; padding: 3px 10px; border-radius: 4px; font-weight: 400; }
  .checkout { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 0;
    border-radius: 0 0 10px 10px; border-top: 3px solid var(--fjord); }
  @media (min-height: 860px) { .checkout { position: sticky; bottom: 12px; box-shadow: 0 -2px 0 var(--frost); } }
  .checkout .sum { font-size: 24px; font-weight: 800; font-variation-settings: "wdth" 110; }
  .demo { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 12px; margin-top: 24px; font-size: 13px; }
  .funnel span { white-space: nowrap; }
</style>
</head>
<body>
<header class="bar"><div class="in">
  <div class="brand">Valio Aimo<small>buying assistant</small></div>
  <div class="right">
    <select id="buyer" aria-label="Customer"></select>
    <a class="btn" id="ordersLink" href="/orders" target="agentgate-orders">Orders <span class="count" id="waiting" hidden></span></a>
  </div>
</div></header>
<div class="wrap">
  <div class="card ask">
    <label class="q" for="msg">What does your kitchen need?</label>
    <textarea id="msg" placeholder="1,000 litres of lactose-free milk by Monday, max 1,200 €. Deliver to the back door."></textarea>
    <div class="foot">
      <div class="hint">Write or say it in English or Finnish. I'll turn it into the boxes below, or fill them in yourself.</div>
      <div class="row">
        <span id="voice" class="row" hidden>
          <select id="voiceLang" aria-label="Speech language" style="padding:7px 8px"><option value="en-GB">English</option><option value="fi-FI">Suomi</option></select>
          <button id="mic" aria-label="Speak your request">🎤 Speak</button>
        </span>
        <button id="fill">Fill in from my request</button>
      </div>
    </div>
  </div>
  <div class="card crit" id="criteria"></div>

  <div id="status" style="margin-top:14px"></div>
  <div id="result"></div>

  <div class="demo" id="demo" hidden>
    <div class="row" style="justify-content:space-between">
      <b>Demo tools</b>
      <div class="row"><button class="small danger" id="rogue">Misbehaving agent</button><button class="small" id="reset">Reset demo</button></div>
    </div>
    <div id="demoOut" class="muted" style="margin-top:8px"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = (v) => v == null ? "–" : v.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const num = (v) => Number(v).toLocaleString("en-GB", { maximumFractionDigits: 2 });
const DEMO = new URLSearchParams(location.search).has("demo");
const CLAIMS = { FREE_FROM_LACTOSE: "Lactose-free", FREE_FROM_GLUTEN: "Gluten-free", VEGAN: "Vegan", FREE_FROM_EGGS: "Egg-free",
  LOW_LACTOSE: "Low-lactose", VEGETARIAN: "Vegetarian", FREE_FROM_SOY: "Soy-free", NO_ADDED_SUGARS: "No added sugar" };
const ALLERGENS = { AM: "milk", AW: "gluten", AE: "egg", AP: "peanuts", AN: "tree nuts", SH: "hazelnut", AY: "soy", AF: "fish",
  AS: "sesame", AC: "crustaceans", UM: "molluscs", BC: "celery", BM: "mustard", NL: "lupin", AU: "sulphites" };
const PRIORITY = { price: "Price", reliability: "Reliability", low_co2: "Carbon footprint" };
let explain = null, lineExplain = null;      // which criterion's reasoning is open (plan card / product)
const FINNISH = ["GOODS_FROM_FINLAND_BLUE_SWAN", "MADE_IN_FINLAND_FLAG_WITH_KEY", "FINNISH_HEART_SYMBOL"], ORGANIC = ["EU_ORGANIC_FARMING"];
const MAIN_CLAIMS = ["FREE_FROM_LACTOSE", "FREE_FROM_GLUTEN", "VEGAN", "FREE_FROM_EGGS"], MAIN_ALLERGENS = ["AM", "AW", "AE", "AP", "AN", "SH"];

let buyers = [], last = null, itemIdx = 0, planIdx = 0, draft = [], quote = null, quoteTimer = null, quoteSeq = 0, editing = false, sent = null;
const blankItem = () => ({ label: "", product_terms: [], quantity: null, unit: "L", must_claims: [], exclude_allergens: [],
  strict_allergens: false, preferred_labels: [], substitutes: [] });
const blankNeed = () => ({ items: [blankItem()], deliver_by: null, budget_eur: null, priorities: ["price"], other_wishes: [], language: "en" });
let crit = blankNeed(), ci = 0, more = false, fillInfo = "";
const cur = () => crit.items[ci];
const buyerId = () => $("buyer").value;
const res = () => last.results[itemIdx];
const opt = (pid) => res().options.find(o => o.product_id === pid);

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || body.detail || r.statusText);
  return body;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });

function icon(o) {      // shelf-label tile: the real pack size instead of a stock photo
  if (!o || !o.content_per_sales_unit) return `<b>${esc((o && o.sales_unit) || "")}</b>`;
  return `<b>${num(o.content_per_sales_unit)} ${esc(o.content_unit === "PCS" ? "pcs" : o.content_unit)}</b><small>per ${esc(o.sales_unit)}</small>`;
}
function stock(o) {
  const cls = o.status === "in_stock" ? "ok" : (o.status === "partial" || o.status === "supplier") ? "warn" : "bad";
  return `<span class="dot ${cls}"></span>${esc(o.available_units_text)}`;
}
function dateText(iso) { return iso ? new Date(iso + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "–"; }

// ------------------------------------------------------------------ criteria (tick boxes)
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function tick(on, label, handler) {
  return `<label class="tick ${on ? "on" : ""}"><input type="checkbox" ${on ? "checked" : ""} onchange="${handler}">${esc(label)}</label>`;
}
function renderCriteria() {
  const it = cur();
  const items = crit.items.length > 1 ? `<div class="row" style="margin-bottom:10px"><span class="faint">Your request has ${crit.items.length} products:</span>${crit.items.map((x, i) =>
    `<button class="small ${i === ci ? "primary" : ""}" onclick="ci=${i};renderCriteria()">${esc(x.label || "Product " + (i + 1))}</button>`).join("")}</div>` : "";
  const claims = [...new Set([...MAIN_CLAIMS, ...(more ? Object.keys(CLAIMS) : []), ...it.must_claims])];
  const allergens = [...new Set([...MAIN_ALLERGENS, ...(more ? Object.keys(ALLERGENS) : []), ...it.exclude_allergens])];
  const fin = it.preferred_labels.some(l => FINNISH.includes(l)) || crit.priorities.includes("finnish_origin");
  const org = it.preferred_labels.some(l => ORGANIC.includes(l)) || crit.priorities.includes("organic");
  const prios = crit.priorities.filter(p => p in PRIORITY);
  $("criteria").innerHTML = `${fillInfo ? `<div class="banner" style="background:var(--soft);margin-bottom:12px;font-size:13px">${fillInfo}</div>` : ""}${items}
    <div class="fields">
      <label class="f"><span>Product <span class="req">*</span></span><input value="${esc(it.label)}" placeholder="lactose-free milk" onchange="setLabel(this.value)"></label>
      <label class="f">Amount<div class="row" style="flex-wrap:nowrap;gap:6px"><input type="number" min="0" step="any" class="grow" value="${it.quantity ?? ""}" placeholder="1 pack"
          onchange="cur().quantity = this.value ? Number(this.value) : null"><select onchange="cur().unit = this.value">${["L", "KG", "PCS"].map(u =>
          `<option value="${u}" ${u === it.unit ? "selected" : ""}>${u === "PCS" ? "pieces" : u === "L" ? "litres" : "kg"}</option>`).join("")}</select></div></label>
      <label class="f">Deliver by<input type="date" value="${crit.deliver_by || ""}" onchange="crit.deliver_by = this.value || null"></label>
      <label class="f">Budget (€)<input type="number" min="0" step="any" value="${crit.budget_eur ?? ""}" placeholder="No limit" onchange="crit.budget_eur = this.value ? Number(this.value) : null"></label>
    </div>
    <div class="groups">
      <div class="group"><div class="t">Must be</div>${claims.map(c => tick(it.must_claims.includes(c), CLAIMS[c] || c.toLowerCase().replace(/_/g, " "), `toggle('must_claims','${c}')`)).join("")}</div>
      <div class="group"><div class="t">Avoid</div>${allergens.map(a => tick(it.exclude_allergens.includes(a), cap(ALLERGENS[a] || a), `toggle('exclude_allergens','${a}')`)).join("")}
        ${tick(it.strict_allergens, "Strict allergy check (school, daycare, hospital)", "cur().strict_allergens = !cur().strict_allergens; renderCriteria()")}
        <button class="ghost small" onclick="more = !more; renderCriteria()">${more ? "Fewer options" : "More options"}</button></div>
      <div class="group"><div class="t">Prefer</div>${tick(fin, "Finnish", "togglePref('finnish')")}${tick(org, "Organic", "togglePref('organic')")}</div>
      <div class="group wide"><div class="t">What matters most <span class="faint">Tick any. They count equally and each gets a star rating${prios.length ? "." : ". With none ticked, price counts."}</span></div>
        ${Object.entries(PRIORITY).map(([k, v]) => tick(prios.includes(k), v, `setPrio('${k}')`)).join("")}</div>
      <div class="group wide"><div class="t">Other wishes <span class="faint">Not a search filter. They travel with the order so the approver sees them.</span></div>
        <ul class="wishes">${crit.other_wishes.map((w, i) => `<li>${esc(w)} <button class="ghost small" aria-label="Remove wish" onclick="crit.other_wishes.splice(${i}, 1); renderCriteria()">✕</button></li>`).join("")}</ul>
        <input id="c_wish" placeholder="Add a wish and press Enter, for example: deliver to the back door" style="width:100%" onkeydown="if (event.key === 'Enter') addWish(this.value)"></div>
    </div>
    <div id="c_err" style="color:var(--bad);font-size:13px;margin-top:8px"></div>
    <div class="go"><span class="muted">Only the product is required. Change anything before you search.</span>
      <div class="row"><button class="ghost" onclick="clearCriteria()">Clear</button><button class="primary" id="find" onclick="find()">Find</button></div></div>`;
}
function setLabel(v) {
  const it = cur(); v = v.trim();
  if (v.toLowerCase() !== (it.label || "").toLowerCase()) { it.product_terms = v.split(/,| or /).map(s => s.trim()).filter(Boolean); it.substitutes = []; }
  it.label = v; $("c_err").textContent = "";
}
function toggle(field, v) { const a = cur()[field], i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1); renderCriteria(); }
function togglePref(kind) {
  const it = cur(), labels = kind === "finnish" ? FINNISH : ORGANIC, pr = kind === "finnish" ? "finnish_origin" : "organic";
  if (it.preferred_labels.some(l => labels.includes(l)) || crit.priorities.includes(pr)) {
    it.preferred_labels = it.preferred_labels.filter(l => !labels.includes(l)); crit.priorities = crit.priorities.filter(p => p !== pr);
  } else it.preferred_labels = [...new Set([...it.preferred_labels, ...labels])];
  renderCriteria();
}
function setPrio(k) {
  crit.priorities = crit.priorities.includes(k) ? crit.priorities.filter(p => p !== k) : [...crit.priorities, k];
  renderCriteria();
}
function starRow(n) {
  let s = "";
  for (let i = 1; i <= 5; i++) s += `<span class="st ${n >= i ? "on" : n >= i - 0.5 ? "half" : ""}">★</span>`;
  return `<span class="stars" aria-label="${n} out of 5 stars">${s}</span> <b style="font-size:13px">${n.toFixed(1)}</b>`;
}
function toggleExplain(j, k) { explain = explain && explain.j === j && explain.k === k ? null : { j, k }; render(); }
function toggleLineExplain(pid, k) { const key = pid + ":" + k; lineExplain = lineExplain === key ? null : key; render(); }
function addWish(v) { if (v.trim()) crit.other_wishes.push(v.trim()); renderCriteria(); $("c_wish").focus(); }
function clearCriteria() { crit = blankNeed(); ci = 0; fillInfo = ""; renderCriteria(); }
function setBusy(on, text) {
  document.querySelectorAll("#fill, #find, #mic").forEach(b => b.disabled = on);
  if (on) $("status").innerHTML = `<div class="banner" style="background:var(--soft)"><div class="spinner"></div>${esc(text)}</div>`;
}

async function fill() {
  const text = $("msg").value.trim();
  if (!text) { $("status").innerHTML = `<div class="banner warn">Write your request first, or fill in the boxes yourself.</div>`; return false; }
  setBusy(true, "Reading your request… about 10 seconds.");
  try {
    const r = await post("/api/demo/understand", { buyer_id: buyerId(), message: text });
    if (r.error) throw new Error(r.error);
    const n = r.need;
    crit = { items: n.items.map(it => ({ ...blankItem(), ...it })), deliver_by: n.deliver_by || null, budget_eur: n.budget_eur || null,
             priorities: n.priorities && n.priorities.length ? n.priorities : ["price"], other_wishes: n.other_wishes || [], language: n.language || "en" };
    ci = 0;
    fillInfo = n.engine === "offline parser" ? "Filled in by the simple built-in reader because the AI isn't available right now. Please check carefully."
      : "Filled in from your request. Check and change anything, then press Find.";
    $("status").innerHTML = ""; renderCriteria(); return true;
  } catch (e) { $("status").innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; return false; }
  finally { setBusy(false); }
}

// ------------------------------------------------------------------ lookup
async function find() {
  if (!crit.items.some(it => (it.label || "").trim()) && $("msg").value.trim()) { if (!(await fill())) return; }
  const pending = $("c_wish") && $("c_wish").value.trim();
  if (pending) { crit.other_wishes.push(pending); renderCriteria(); }
  const items = crit.items.filter(it => (it.label || "").trim());
  if (!items.length) { $("c_err").textContent = "Write which product you need. It's the only required box."; return; }
  const need = { ...crit, items: items.map(it => ({ ...it, product_terms: it.product_terms.length ? it.product_terms : [it.label], quantity: it.quantity || 0 })) };
  sent = null; quote = null; $("result").innerHTML = "";
  setBusy(true, "Finding the best way to get it… about 20 seconds.");
  try {
    const r = await post("/api/demo/lookup", { buyer_id: buyerId(), message: $("msg").value.trim() || items.map(i => i.label).join(", "), need });
    if (r.error) throw new Error(r.error);
    last = r; itemIdx = 0; explain = null; lineExplain = null;
    $("status").innerHTML = r.live_error ? `<div class="banner bad">Valio's live stock and prices can't be reached right now, so nothing can be confirmed. Try again in a moment.</div>` : "";
    selectPlan(0);
  } catch (e) { $("status").innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
  finally { setBusy(false); }
}

function selectPlan(j) {
  planIdx = j; quote = null; sent = null;
  const p = res().plans[j];
  draft = p ? p.lines.map(l => ({ product_id: l.product_id, units: l.units, match: l.match })) : [];
  render();
  requestQuote();
}

// ------------------------------------------------------------------ render
function render() {
  if (!last) return;
  const r = res();
  $("result").innerHTML = assumptionsHtml() + plansHtml(r) + draftHtml(r) + checkoutHtml();
  if (DEMO) demoStats();
}

function assumptionsHtml() {
  const items = last.results.length > 1 ? `<div class="row" style="margin-top:18px"><span class="faint">Results for</span>${last.results.map((x, i) =>
    `<button class="small ${i === itemIdx ? "primary" : ""}" onclick="itemIdx=${i};selectPlan(0)">${esc(x.item.label)}</button>`).join("")}</div>` : "";
  const a = (last.assumptions || []).filter(x => x.field !== "budget_eur");
  return items + (a.length ? `<div class="banner warn" style="margin-top:14px;font-size:14px">⚠ ${a.map(x => esc(x.text)).join(" · ")}</div>` : "");
}

function planWhat(p) {
  if (p.kind === "partial") return `Only ${num(p.covered)} ${esc(p.content_unit)} available`;
  const l = p.lines;
  if (l.length === 1) {
    const o = opt(l[0].product_id);
    return `${num(l[0].units)} × ${esc(shortName(l[0].name))}${o && o.content_per_sales_unit ? ` <span class="faint">(${num(o.content_per_sales_unit)} ${esc(o.content_unit)})</span>` : ""}`;
  }
  return `${l.length} products, split`;
}
function shortName(n) { return n.length > 38 ? n.slice(0, 36) + "…" : n; }
function planBand(p) {
  if (p.confidence === "confirmed") return `<div class="band ok"><span class="dot ok"></span>In Valio stock, confirmed</div>`;
  if (p.confidence === "partly confirmed") return `<div class="band warn"><span class="dot warn"></span>Partly in Valio stock</div>`;
  return `<div class="band warn"><span class="dot warn"></span>Supplier stock, not guaranteed</div>`;
}
function planNote(p) {
  if (p.lines.every(l => l.match === "exact")) return "";
  const kind = p.lines.some(l => l.match === "substitute") ? "Includes a substitute" : "Includes a close variant";
  return `<div class="note">${kind}${p.lines.some(l => l.valio_pick && l.match !== "exact") ? ", Valio's pick ★" : ""}</div>`;
}
function planStatus(p) {
  const exact = p.lines.every(l => l.match === "exact");
  const valio = p.lines.some(l => l.valio_pick && l.match !== "exact") ? " · ★ Valio's pick" : "";
  if (p.confidence === "confirmed") return `<span class="dot ok"></span>In Valio stock${exact ? "" : ` · <span class="muted">${p.is_substitute && p.lines.some(l => l.match === "substitute") ? "substitute" : "close variant"}${valio}</span>`}`;
  if (p.confidence === "partly confirmed") return `<span class="dot warn"></span>Partly guaranteed`;
  return `<span class="dot warn"></span>Not guaranteed`;
}

function plansHtml(r) {
  if (!r.plans.length) return `<h2>Ways to get it</h2><div class="banner warn">${esc(r.plan.why)}</div>`;
  const ep = explain && r.plans[explain.j];
  const ex = ep && (explain.k === "_top" ? { name: "Why it's highest rated", stars: ep.rating_stars, why: ep.highest_rated_why } : ep.ratings[explain.k]);
  return `<h2>${r.plans.length === 1 ? "The way to get it" : r.plans.length + " ways to get it"}</h2><div class="plans">${r.plans.map((p, j) => `
    <div class="card plan ${j === planIdx ? "sel" : ""}" role="button" tabindex="0" onclick="selectPlan(${j})" onkeydown="if (event.key === 'Enter') selectPlan(${j})">
      ${planBand(p)}<div class="body">
      <div class="top"><span class="label">${esc(p.label)}</span><span class="price">${eur(p.total_eur)}</span></div>
      ${p.highest_rated ? `<button class="pill badge-top ${explain && explain.j === j && explain.k === "_top" ? "accent" : "ok"}"
          onclick="event.stopPropagation(); toggleExplain(${j}, '_top')" title="Why?">★ Highest rated <span class="faint">ⓘ</span></button>` : ""}
      <div class="what">${planWhat(p)}</div>
      ${planNote(p)}
      ${p.over_budget ? `<div class="faint" style="color:var(--bad);margin-top:4px">Over your budget</div>` : ""}
      ${p.rating_stars != null && p.criteria.length ? `<div class="rating">
        <div class="crit-row" style="font-weight:600"><span>Overall</span>${starRow(p.rating_stars)}</div>
        ${p.criteria.map(k => `<button class="crit-row ${explain && explain.j === j && explain.k === k ? "on" : ""}" title="Why?"
            onclick="event.stopPropagation(); toggleExplain(${j}, '${k}')"><span>${esc(p.ratings[k].name)} <span class="faint">ⓘ</span></span>${starRow(p.ratings[k].stars)}</button>`).join("")}
      </div>` : ""}
    </div></div>`).join("")}</div>
    ${ex ? `<div class="explain"><b>${esc(r.plans[explain.j].label)} · ${esc(ex.name)}${ex.stars != null ? ": " + ex.stars.toFixed(1) + "★" : ""}</b>
      <button class="ghost small" style="float:right" onclick="explain=null;render()" aria-label="Close">✕</button><div style="margin-top:4px">${esc(ex.why)}</div></div>` : ""}`;
}

function alternatives(line) {
  const o = opt(line.product_id), inDraft = new Set(draft.map(d => d.product_id));
  return res().options.filter(x => !inDraft.has(x.product_id) && x.on_time && x.unit_price_eur && x.content_per_sales_unit &&
      ["in_stock", "partial", "supplier"].includes(x.status) && x.match !== "different")
    .sort((a, b) => valioFor(b, line) - valioFor(a, line) || (a.status === "supplier") - (b.status === "supplier") ||
                    (a.comparison_price_eur || 1e9) - (b.comparison_price_eur || 1e9))
    .slice(0, 3);
}
function valioFor(o, line) { return (o.valio_substitute_for || []).includes(line.product_id) ? 1 : 0; }
function valioNote(o) {
  return o.valio_pick && o.match !== "exact" ? `<span class="pill ok" style="font-size:12px;padding:1px 8px">★ Valio's pick</span>` : "";
}

function draftHtml(r) {
  if (!draft.length) return "";
  const unit = r.item.unit;
  return `<h2>Your draft order</h2><div class="card docket">${draft.map((d, k) => {
    const o = opt(d.product_id) || {};
    const content = (o.content_per_sales_unit || 0) * d.units;
    const vat = o.tax_rate != null && o.comparison_price_eur ? ` · ${eur(o.comparison_price_eur * (1 + o.tax_rate / 100))} with VAT` : "";
    const alts = alternatives(d);
    return `<div class="line">
      <div class="thumb">${icon(o)}</div>
      <div class="grow">
        <div class="name">${esc(o.name)}</div>
        <div class="meta"><span>No. ${esc(o.product_id)}</span>${o.brand ? `<span>${esc(o.brand)}</span>` : ""}${o.origin ? `<span>Origin ${esc(o.origin)}</span>` : ""}${o.labels && o.labels.length ? `<span>${esc(o.labels[0])}</span>` : ""}</div>
        <div class="row" style="gap:6px;font-size:13px;margin-top:2px">${stock(o)}</div>
        <div style="font-size:14px;margin-top:2px"><b>${eur(o.comparison_price_eur || o.unit_price_eur)}</b> / ${esc(o.comparison_price_eur ? unit : o.sales_unit)}<span class="faint">${vat}</span></div>
        ${(o.criteria || []).length ? `<div class="row" style="gap:6px;margin-top:6px">${o.criteria.map(c =>
          `<button class="crit-row inline ${lineExplain === o.product_id + ":" + c ? "on" : ""}" onclick="toggleLineExplain('${o.product_id}', '${c}')">${esc(o.ratings[c].name)} ${starRow(o.ratings[c].stars)}</button>`).join("")}</div>
          ${lineExplain && lineExplain.startsWith(o.product_id + ":") ? `<div class="explain" style="margin-top:6px">${esc(o.ratings[lineExplain.split(":")[1]].why)}</div>` : ""}` : ""}
        ${d.match !== "exact" ? `<div class="row" style="gap:6px;margin-top:2px">${valioNote(o)}<span class="faint" style="color:var(--warn)">${d.match === "close" ? "Close variant" : "Substitute"}: ${esc(o.match_reason)}</span></div>` : ""}
        ${alts.length ? `<div class="alts"><span class="faint">Swap for</span>${alts.map(a => `<button onclick="swap(${k}, '${a.product_id}')" title="${esc(a.name)} (${esc(a.available_units_text)})">
          <span class="dot ${a.status === "supplier" || a.status === "partial" ? "warn" : "ok"}"></span>${valioFor(a, d) ? "★ Valio's pick: " : ""}${esc(a.brand || shortName(a.name))} ${num(a.content_per_sales_unit)} ${esc(unit)} pack${a.match !== "exact" ? " (" + esc(a.match === "close" ? "variant" : "substitute") + ")" : ""} · ${eur(a.comparison_price_eur)}/${esc(unit)}</button>`).join("")}</div>` : ""}
        <details class="why"><summary>Where this comes from</summary><ul>${Object.entries(o.evidence || {}).map(([k2, v]) => `<li><b>${esc(k2.replace("_", " "))}:</b> ${esc(v)}</li>`).join("")}
          ${o.contains_allergens && o.contains_allergens.length ? `<li><b>contains:</b> ${esc(o.contains_allergens.join(", "))}</li>` : ""}
          ${o.may_contain_allergens && o.may_contain_allergens.length ? `<li><b>may contain:</b> ${esc(o.may_contain_allergens.join(", "))}</li>` : ""}</ul></details>
      </div>
      <div class="qty" style="text-align:center">
        <div class="stepper"><button onclick="step(${k},-1)" aria-label="Less">−</button><input type="number" min="0" value="${d.units}" onchange="setUnits(${k}, this.value)" aria-label="Quantity"><button onclick="step(${k},1)" aria-label="More">+</button></div>
        <div class="faint" style="margin-top:4px">${esc(o.sales_unit)}${content ? " · " + num(content) + " " + esc(unit) : ""}</div>
      </div>
      <div class="total">${eur((o.unit_price_eur || 0) * d.units)}</div>
    </div>`;
  }).join("")}</div>`;
}

function checkoutHtml() {
  if (!draft.length) return "";
  if (sent) return `<div style="margin-top:16px">${sent}</div>`;
  const local = draft.reduce((s, d) => s + (opt(d.product_id)?.unit_price_eur || 0) * d.units, 0);
  const covered = draft.reduce((s, d) => s + (opt(d.product_id)?.content_per_sales_unit || 0) * d.units, 0);
  const want = res().item.quantity, unit = res().item.unit;
  const short = unit !== "PCS" && covered < want - 1e-6 ? `<div class="faint" style="color:var(--warn)">This covers ${num(covered)} of the ${num(want)} ${esc(unit)} you asked for.</div>` : "";
  let verdict = `<div class="row muted"><div class="spinner"></div>Checking today's fixed price…</div>`, action = "";
  if (quote && quote.error) verdict = `<div style="color:var(--bad);font-size:14px">${esc(quote.error)}</div>` +
      (res().plans.length > 1 ? `<button class="ghost" onclick="selectPlan(${(planIdx + 1) % res().plans.length})">Try the next way</button>` : "");
  else if (quote) {
    const pv = quote.policy_preview, held = quote.valid_until.slice(11, 16);
    const tags = (pv.tags || []).map(t => `<span class="pill ${pv.decision === "blocked" ? "bad" : "warn"}">${esc(t.text)}</span>`).join("");
    if (pv.decision === "blocked") { verdict = `<div style="color:var(--bad);font-size:14px">Can't be ordered: ${esc(pv.reasons.join(" "))}</div><div class="row" style="margin-top:4px">${tags}</div>`; }
    else if (pv.decision === "needs_human_approval") {
      verdict = `<div class="muted">${esc(pv.approver)} will approve. Price held until ${held}.</div><div class="row" style="margin-top:4px">${tags}</div>`;
      action = `<button class="primary" onclick="send()">Send for approval</button>`;
    } else {
      verdict = `<div style="color:var(--ok);font-size:14px">Within your rules, so the agent can order this now. Price held until ${held}.</div>`;
      action = `<button class="primary" onclick="send()">Place order</button>`;
    }
  }
  const total = quote && !quote.error ? quote.total_eur : local;
  return `<div class="card checkout"><div class="grow"><div class="sum">Total ${eur(total)} <span class="faint" style="font-weight:400;font-variation-settings:'wdth' 100">excl. VAT</span></div>${short}${verdict}</div>${action}</div>`;
}

// ------------------------------------------------------------------ draft editing
function step(k, by) { setUnits(k, Math.max(0, draft[k].units + by)); }
function setUnits(k, v) {
  const n = Math.max(0, Math.round(Number(v) || 0));
  draft[k].units = n;
  if (!draft.some(d => d.units > 0)) draft[k].units = 1;
  quote = null; sent = null; render(); requestQuote();
}
function swap(k, pid) {
  const old = opt(draft[k].product_id), o = opt(pid);
  const content = (old.content_per_sales_unit || 0) * draft[k].units;
  draft[k] = { product_id: pid, units: Math.max(1, Math.ceil(content / (o.content_per_sales_unit || 1) - 1e-9)), match: o.match };
  quote = null; render(); requestQuote();
}
function requestQuote() {
  clearTimeout(quoteTimer);
  const seq = ++quoteSeq;
  quoteTimer = setTimeout(async () => {
    try { const q = await post("/api/demo/quote", { buyer_id: buyerId(), deliver_by: last.deliver_by, lines: draft.filter(d => d.units > 0),
            is_substitute: draft.some(d => d.match !== "exact"), declared_risks: declaredRisks() }); if (seq === quoteSeq) quote = q; }
    catch (e) { if (seq === quoteSeq) quote = { error: e.message }; }
    if (seq === quoteSeq && !editing) render();
  }, 500);
}
function declaredRisks() { const p = res().plans[planIdx]; return p && !draftChanged() ? p.approval_needed : []; }
function draftChanged() {
  const p = res().plans[planIdx];
  return !p || p.lines.length !== draft.length || p.lines.some((l, i) => l.product_id !== draft[i].product_id || l.units !== draft[i].units);
}
async function send() {
  const p = res().plans[planIdx], changed = draftChanged();
  const reason = `${p.label} plan (${p.confidence}) for ${num(res().item.quantity)} ${res().item.unit} ${res().item.label}. ` +
    (changed ? "The buyer adjusted the products or quantities. " : "") + p.why;
  try {
    const o = await post("/api/demo/order", { buyer_id: buyerId(), quote_id: quote.quote_id, reason,
      is_substitute: draft.some(d => d.match !== "exact"), declared_risks: declaredRisks(), notes: last.need.other_wishes || [] });
    if (o.error) throw new Error(o.error);
    const link = `<a href="/orders?buyer=${buyerId()}" target="agentgate-orders">${esc(o.order_id)}</a>`;
    sent = o.status === "confirmed" ? `<div class="banner ok">✓ Order ${link} placed: ${eur(o.total_eur)}, delivery ${dateText(o.deliver_by)}.</div>`
      : o.status === "pending_approval" ? `<div class="banner warn">Sent to the ${esc(o.policy.approver)} for approval: order ${link}, ${eur(o.total_eur)}.${o.approve_by ? ` Approve by ${esc(o.approve_by.replace("T", " "))} to keep the delivery date.` : ""}</div>`
      : `<div class="banner bad">The door rejected order ${link}: ${esc(o.policy.reasons.join(" "))}</div>`;
  } catch (e) { sent = `<div class="banner bad">${esc(e.message)}</div>`; }
  render(); pollOrders();
}

// ------------------------------------------------------------------ orders badge, buyer, demo
async function pollOrders() {
  try {
    const orders = await api(`/api/demo/orders?buyer_id=${buyerId()}`);
    const n = orders.filter(o => o.status === "pending_approval").length;
    $("waiting").hidden = !n; $("waiting").textContent = n + " waiting";
  } catch (e) { /* the badge is a convenience */ }
}
async function loadBuyers() {
  buyers = await api("/api/demo/buyers");
  const want = new URLSearchParams(location.search).get("buyer");
  $("buyer").innerHTML = buyers.map(b => `<option value="${b.buyer_id}" ${b.buyer_id === want ? "selected" : ""}>${esc(b.buyer)}</option>`).join("");
  onBuyer();
}
function onBuyer() { $("ordersLink").href = `/orders?buyer=${buyerId()}`; pollOrders(); }

function demoStats() {
  const r = res(), f = r.funnel;
  $("demoOut").innerHTML = `<div class="funnel">${[`${f.catalog.toLocaleString("en")} products`, ...f.steps.map(s => `${s.remaining} ${esc(s.step)}`),
    `${f.judged} judged by AI`, `${f.checked_live} checked live`].map(s => `<span>${s}</span>`).join(" → ")}</div>
    <div>Understood by ${esc(last.need.engine)} · ${last.ai_usage.calls} AI call(s), $${last.ai_usage.usd} · ${last.api.calls} Valio API call(s) for ${last.api.products_checked} products
    ${f.substitutes_note ? "<br>" + esc(f.substitutes_note) : ""}
    <br>Valio's own substitution list: ${f.valio_substitutes_added} added${f.valio_substitutes_dropped ? `, ${f.valio_substitutes_dropped} left out (don't meet your requirements)` : ""}</div>
    <div>Plan scores: ${r.plans.map(p => `${esc(p.label)} ${p.score} (certainty ${p.certainty}, match ${p.fidelity})`).join(" · ")}</div>`;
}

$("fill").onclick = () => fill();

// Voice: speak the request (hands-free), then the boxes are filled in from it. Uses the browser's own
// speech recognition (Chrome, Edge); the button is hidden where the browser doesn't offer it.
const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Speech) {
  $("voice").hidden = false;
  let rec = null, before = "";
  $("mic").onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new Speech(); rec.lang = $("voiceLang").value; rec.interimResults = true; rec.continuous = false;
    before = $("msg").value.trim(); let heard = "";
    $("mic").classList.add("on"); $("mic").textContent = "■ Stop";
    $("status").innerHTML = `<div class="banner" style="background:var(--soft)"><div class="spinner"></div>Listening… say what, how much and by when.</div>`;
    rec.onresult = (e) => {
      heard = [...e.results].map(r => r[0].transcript).join(" ");
      $("msg").value = (before ? before + " " : "") + heard;
    };
    rec.onerror = (e) => {
      $("status").innerHTML = `<div class="banner bad">${e.error === "not-allowed" ? "Microphone access was blocked. Allow it in the browser to speak your request."
        : e.error === "no-speech" ? "I didn't hear anything. Try again." : "Speech input stopped: " + esc(e.error)}</div>`;
    };
    rec.onend = () => {
      rec = null; $("mic").classList.remove("on"); $("mic").textContent = "🎤 Speak";
      if (heard.trim()) fill(); else if ($("status").textContent.startsWith("Listening")) $("status").innerHTML = "";
    };
    rec.start();
  };
}
$("msg").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); fill(); } });
renderCriteria();
$("buyer").onchange = () => { onBuyer(); if (last && draft.length) { quote = null; sent = null; render(); requestQuote(); } };
if (DEMO) {
  $("demo").hidden = false;
  $("rogue").onclick = async () => {
    $("demoOut").innerHTML = `<div class="row"><div class="spinner"></div>A misbehaving agent is trying to break the rules…</div>`;
    const r = await post("/api/demo/rogue", { buyer_id: buyerId() });
    $("demoOut").innerHTML = `<ul style="margin:0;padding-left:18px">${r.steps.map(s => `<li>${esc(s.attempt)} → <b>${esc(s.result.status || (s.result.error ? "refused" : "?"))}</b>: ${esc(s.result.error || s.result.policy?.reasons.join(" ") || "")}</li>`).join("")}</ul>`;
  };
  $("reset").onclick = async () => { await post("/api/demo/reset", {}); last = null; $("result").innerHTML = ""; $("status").innerHTML = ""; $("msg").value = "";
    clearCriteria(); $("demoOut").textContent = "Demo reset."; loadBuyers(); };
}
loadBuyers(); setInterval(pollOrders, 5000);
</script>
</body>
</html>
