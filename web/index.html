<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trusted Trade Agents</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #e2e5ea;
    --accent: #0b5cad; --ok: #1f7a3d; --warn: #9a5b00; --bad: #b42318; --chip: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1f25; --ink: #e8ebef; --muted: #9aa4b1; --line: #2b323b;
      --accent: #5aa2ff; --ok: #4cc27a; --warn: #f0a842; --bad: #ff6b5e; --chip: #232a33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: var(--muted); }
  main { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 14px; padding: 14px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-height: 200px; overflow: hidden; }
  h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  select, textarea, input, button { font: inherit; color: inherit; }
  select, textarea, input { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  textarea { min-height: 70px; resize: vertical; }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button.reject { background: transparent; border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .policy { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
  .step { border-left: 3px solid var(--line); padding: 4px 10px; margin: 6px 0; }
  .step b { font-family: ui-monospace, monospace; font-size: 12px; }
  .step pre { margin: 4px 0 0; font-size: 11px; max-height: 120px; overflow: auto; white-space: pre-wrap; color: var(--muted); }
  .answer { background: var(--chip); border-radius: 8px; padding: 10px; margin-top: 10px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .status { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--chip); }
  .status.confirmed { color: var(--ok); } .status.pending_approval { color: var(--warn); } .status.rejected { color: var(--bad); }
  .muted { color: var(--muted); font-size: 12px; }
  .log { font-size: 12px; border-bottom: 1px solid var(--line); padding: 6px 0; }
  .log .who { font-family: ui-monospace, monospace; color: var(--accent); }
  .empty { color: var(--muted); font-style: italic; }
  .scroll { max-height: 70vh; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>Trusted Trade Agents</h1>
  <p>External purchasing agent &rarr; open wholesaler interface &rarr; policy &rarr; human approval &rarr; audit trail</p>
</header>
<main>
  <section>
    <h2>1 · Buyer's agent</h2>
    <select id="buyer"></select>
    <div class="policy" id="policy"></div>
    <textarea id="msg">I need 1,000 litres of lactose-free milk by Monday. Find an option that meets our requirements based on price and availability.</textarea>
    <div class="row">
      <button id="send">Send to agent</button>
      <button class="secondary" id="reset">Reset demo</button>
    </div>
    <div id="transcript" class="scroll"></div>
  </section>
  <section>
    <h2>2 · Orders &amp; approvals</h2>
    <div id="orders" class="scroll"></div>
  </section>
  <section>
    <h2>3 · Audit trail</h2>
    <div id="audit" class="scroll"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let buyers = [];

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || body.detail || res.statusText);
  return body;
}

function showPolicy() {
  const b = buyers.find(x => x.id === $("buyer").value);
  if (!b) return;
  const p = b.policy;
  $("policy").textContent = `Agent may order alone up to ${p.auto_approve_limit_eur} € · above that: ${b.approver} approves · hard limit ${p.hard_limit_eur} € · categories: ${p.allowed_categories.join(", ")}`;
}

async function loadBuyers() {
  buyers = await api("/api/demo/buyers");
  $("buyer").innerHTML = buyers.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join("");
  showPolicy();
}

function renderTranscript(r) {
  const steps = r.steps.map(s => `
    <div class="step"><b>${esc(s.tool)}</b> <span class="muted">${esc(JSON.stringify(s.args))}</span>
      <pre>${esc(JSON.stringify(s.result, null, 1)).slice(0, 1500)}</pre></div>`).join("");
  $("transcript").innerHTML = `<div class="muted">engine: ${esc(r.engine)}</div>${steps}<div class="answer">${esc(r.answer)}</div>`;
}

async function refresh() {
  const [orders, audit] = await Promise.all([api("/api/demo/orders"), api("/api/demo/audit")]);
  $("orders").innerHTML = orders.length ? orders.map(o => `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin:0">
        <b>${esc(o.order_id)} · ${o.total_eur.toFixed(2)} €</b>
        <span class="status ${o.status}">${esc(o.status.replace("_", " "))}</span>
      </div>
      <div class="muted">${esc(o.buyer_name)} · deliver by ${esc(o.deliver_by || "-")}</div>
      <ul>${o.lines.map(l => `<li>${l.quantity} ${esc(l.unit)} ${esc(l.name)} <span class="muted">(${esc(l.supplier)}, ${l.unit_price_eur} €)</span></li>`).join("")}</ul>
      <div><b>Agent's reason:</b> ${esc(o.agent_reason)}</div>
      <div class="muted"><b>Policy:</b> ${esc(o.policy.reasons.join(" "))}</div>
      ${o.status === "pending_approval" ? `
        <input id="note-${o.order_id}" placeholder="Note (optional)">
        <div class="row">
          <button onclick="decide('${o.order_id}', true)">Approve</button>
          <button class="reject" onclick="decide('${o.order_id}', false)">Reject</button>
        </div>` : `<div class="muted">Decided by: ${esc(o.decided_by)}${o.decision_note ? " — " + esc(o.decision_note) : ""}</div>`}
    </div>`).join("") : `<div class="empty">No orders yet.</div>`;
  $("audit").innerHTML = audit.length ? audit.map(a => `
    <div class="log"><span class="muted">${esc(a.at.slice(11))}</span> <span class="who">${esc(a.actor)}</span> ${esc(a.summary)}
      ${a.reason ? `<div class="muted">why: ${esc(a.reason)}</div>` : ""}</div>`).join("") : `<div class="empty">Nothing logged yet.</div>`;
}

async function decide(orderId, approve) {
  const b = buyers.find(x => x.id === $("buyer").value);
  try {
    await api(`/api/human/orders/${orderId}/decision`, { method: "POST",
      body: JSON.stringify({ approve, approver: b ? b.approver : "Manager", note: $("note-" + orderId)?.value || "" }) });
  } catch (e) { alert(e.message); }
  refresh();
}

$("buyer").onchange = showPolicy;
$("send").onclick = async () => {
  $("send").disabled = true;
  $("transcript").innerHTML = `<div class="muted">Agent is working…</div>`;
  try { renderTranscript(await api("/api/demo/chat", { method: "POST", body: JSON.stringify({ buyer_id: $("buyer").value, message: $("msg").value }) })); }
  catch (e) { $("transcript").innerHTML = `<div class="answer">Error: ${esc(e.message)}</div>`; }
  $("send").disabled = false;
  refresh();
};
$("reset").onclick = async () => { await api("/api/demo/reset", { method: "POST" }); $("transcript").innerHTML = ""; refresh(); };

loadBuyers(); refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
