<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGate</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --ink:#1b1f24; --muted:#5d6673; --line:#e2e5ea; --accent:#0b5cad; --accent-soft:#e8f1fb;
    --ok:#1f7a3d; --warn:#9a5b00; --bad:#b42318; --chip:#eef2f7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --panel:#1a1f25; --ink:#e8ebef; --muted:#9aa4b1;
    --line:#2b323b; --accent:#5aa2ff; --accent-soft:#1c2a3a; --ok:#4cc27a; --warn:#f0a842; --bad:#ff6b5e; --chip:#232a33; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; } header .tag { color:var(--muted); }
  header .status { margin-left:auto; font-size:12px; color:var(--muted); }
  main { display:grid; grid-template-columns:1.6fr 1fr 0.9fr; gap:12px; padding:12px; }
  @media (max-width:1100px) { main { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
  h2 { font-size:12px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  h3 { font-size:14px; margin:12px 0 6px; }
  select,textarea,input,button { font:inherit; color:inherit; }
  select,textarea,input { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
  textarea { min-height:56px; resize:vertical; }
  button { padding:6px 12px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); }
  button.danger { background:transparent; border-color:var(--bad); color:var(--bad); }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); font-size:12px; }
  .chip { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; background:var(--chip); margin:2px 4px 2px 0; }
  .chip.ok { color:var(--ok); } .chip.warn { color:var(--warn); } .chip.bad { color:var(--bad); } .chip.accent { color:var(--accent); background:var(--accent-soft); }
  .mandate { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; font-size:12.5px; }
  .mandate.revoked { border-color:var(--bad); }
  .mandate ul { margin:4px 0; padding-left:18px; }
  .funnel { display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:12px; margin:6px 0; }
  .funnel .n { font-weight:700; } .funnel .arrow { color:var(--muted); }
  .funnel .stage { background:var(--chip); border-radius:6px; padding:2px 6px; }
  .plan { border:2px solid var(--accent); border-radius:10px; padding:10px; margin:10px 0; background:var(--accent-soft); }
  .plans { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px; margin:10px 0 4px; align-items:stretch; }
  .gbb { border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .gbb.best { border:2px solid var(--accent); background:var(--accent-soft); }
  .gbb .head { display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
  .gbb .label { font-weight:700; font-size:15px; }
  .gbb .total { font-weight:700; font-size:16px; white-space:nowrap; }
  .gbb ul { margin:0; padding-left:16px; font-size:12.5px; }
  .gbb .foot { margin-top:auto; padding-top:4px; }
  .meter { display:grid; grid-template-columns:62px 1fr 38px; gap:6px; align-items:center; font-size:12px; }
  .meter .bar { height:6px; border-radius:99px; background:var(--chip); overflow:hidden; }
  .meter .bar i { display:block; height:100%; background:var(--accent); border-radius:99px; }
  .meter .v { text-align:right; font-variant-numeric:tabular-nums; }
  .sub-note { font-size:12px; color:var(--muted); margin:4px 0; }
  ul.reasons { margin:4px 0; padding-left:18px; font-size:12px; color:var(--muted); }
  .opt { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0; }
  .opt.best { border-color:var(--accent); }
  .opt .top { display:flex; justify-content:space-between; gap:8px; }
  .opt .price { font-weight:700; white-space:nowrap; }
  .flags { color:var(--warn); font-size:12px; margin-top:2px; }
  details { font-size:12px; color:var(--muted); margin-top:4px; } details ul { margin:4px 0; padding-left:18px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; }
  .status-pill { font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--chip); }
  .confirmed { color:var(--ok); } .pending_approval { color:var(--warn); } .rejected { color:var(--bad); }
  .log { font-size:12px; border-bottom:1px solid var(--line); padding:6px 0; }
  .log .who { font-family:ui-monospace,monospace; color:var(--accent); }
  .hash { font-family:ui-monospace,monospace; font-size:10px; color:var(--muted); }
  .scroll { max-height:76vh; overflow:auto; }
  .empty { color:var(--muted); font-style:italic; }
  ul.lines { margin:6px 0; padding-left:18px; }
</style>
</head>
<body>
<header>
  <h1>AgentGate · Valio Aimo</h1>
  <span class="tag">Any AI agent can order from Valio Aimo, but no agent can break Valio's rules.</span>
  <span class="status" id="status"></span>
</header>
<main>
  <section>
    <h2>1 · Buyer's agent: Smart Lookup</h2>
    <select id="buyer"></select>
    <div id="mandate" class="mandate"></div>
    <textarea id="msg">I need 1,000 litres of lactose-free milk by Monday. Find an option that meets our requirements based on price and availability.</textarea>
    <div class="row">
      <button id="send">Look up</button>
      <button class="secondary" data-example="Tarvitsen 1000 litraa laktoositonta maitoa maanantaiksi">Finnish</button>
      <button class="secondary" data-example="24 litres of oat drink by Monday">Small order</button>
      <button class="danger" id="rogue">Misbehaving agent</button>
      <button class="secondary" id="reset">Reset</button>
    </div>
    <div id="result" class="scroll"></div>
  </section>
  <section>
    <h2>2 · Orders &amp; approvals</h2>
    <div id="orders" class="scroll"></div>
  </section>
  <section>
    <h2>3 · Audit trail <span id="verify"></span></h2>
    <div id="audit" class="scroll"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = (v) => v == null ? "–" : v.toLocaleString("fi-FI", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
let buyers = [], last = null;
const current = () => buyers.find(b => b.buyer_id === $("buyer").value);

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || body.detail || res.statusText);
  return body;
}

function showMandate() {
  const m = current(); if (!m) return;
  const usual = Object.values(m.usual_weekly || {}).map(u => `${u.quantity} ${u.unit} ${u.name}`).join(", ");
  $("mandate").className = "mandate" + (m.revoked ? " revoked" : "");
  $("mandate").innerHTML = `
    <div class="row" style="justify-content:space-between;margin:0">
      <b>Mandate ${esc(m.id)} · ${esc(m.agent_name)}</b>
      <span class="chip ${m.revoked ? "bad" : "ok"}">${m.revoked ? "REVOKED" : "active"}</span>
    </div>
    <ul>
      <li>Orders alone up to <b>${m.auto_approve_limit_eur} €</b>; above that the ${esc(m.approver)} approves · never above <b>${m.hard_limit_eur} €</b></li>
      <li>${m.food_only ? "Food only" : "Any products"} · delivery within ${m.max_lead_time_days} days · over ${m.unusual_order_factor}× the usual weekly order needs approval (usual: ${esc(usual || "n/a")})</li>
    </ul>
    <button class="${m.revoked ? "secondary" : "danger"}" id="toggleMandate">${m.revoked ? "Reinstate mandate" : "Revoke mandate"}</button>`;
  $("toggleMandate").onclick = async () => {
    await api(`/api/human/mandates/${m.buyer_id}/${m.revoked ? "reinstate" : "revoke"}`, { method: "POST", body: JSON.stringify({ by: m.approver }) });
    await loadBuyers(); refresh();
  };
}

async function loadBuyers() {
  const sel = $("buyer").value;
  buyers = await api("/api/demo/buyers");
  $("buyer").innerHTML = buyers.map(b => `<option value="${b.buyer_id}">${esc(b.buyer)}</option>`).join("");
  if (sel) $("buyer").value = sel;
  showMandate();
}

function funnel(r) {
  const f = r.funnel;
  const stages = [`<span class="stage"><span class="n">${f.catalog.toLocaleString("en")}</span> products</span>`]
    .concat(f.steps.map(s => `<span class="arrow">→</span><span class="stage" title="${esc(s.step)}"><span class="n">${s.remaining}</span> ${esc(s.step)}</span>`))
    .concat([`<span class="arrow">→</span><span class="stage"><span class="n">${f.judged}</span> judged by AI</span>`,
             `<span class="arrow">→</span><span class="stage"><span class="n">${f.checked_live}</span> checked live</span>`]);
  const ideas = (f.substitute_ideas || []).filter(s => s.candidates);
  const note = f.substitutes_note ? `<div class="sub-note">↪ Substitutes${ideas.length ? " (" + ideas.map(s => esc(s.label)).join(", ") + ")" : ""}: ${esc(f.substitutes_note)}</div>` : "";
  return `<div class="funnel">${stages.join("")}</div>${note}`;
}

function meter(name, v) {
  const pct = Math.round(v * 100);
  return `<div class="meter"><span class="muted">${name}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="v">${pct}%</span></div>`;
}

function planCard(p, i, j, unit) {
  const conf = { "confirmed": "ok", "partly confirmed": "warn", "not confirmed": "bad" }[p.confidence] || "";
  return `<div class="gbb ${j === 0 ? "best" : ""}">
    <div class="head"><span class="label">${j === 0 ? "★ " : ""}${esc(p.label)}</span><span class="total">${eur(p.total_eur)}</span></div>
    <div><span class="chip ${conf}">${esc(p.confidence)}</span><span class="chip">${esc(p.kind)}</span>
      <span class="chip">${p.price_per_unit != null ? eur(p.price_per_unit) + "/" + esc(unit) : ""}</span></div>
    ${meter("Certainty", p.certainty)}${meter("Fidelity", p.fidelity)}
    <div class="muted" title="0.55 × delivery certainty + 0.45 × match fidelity; price breaks ties">Score ${p.score.toFixed(2)} = 0.55 × ${p.certainty.toFixed(2)} + 0.45 × ${p.fidelity.toFixed(2)}</div>
    <ul>${p.lines.map(l => `<li>${l.units} × ${esc(l.sales_unit)} ${esc(l.name)} <span class="muted">(${l.content} ${esc(unit)}, ${esc(l.source)}${l.match !== "exact" ? ", " + esc(l.match) : ""}) · ${eur(l.total_eur)}</span></li>`).join("")}</ul>
    <div class="muted">${esc(p.why)}</div>
    ${p.trade_offs.length ? `<div class="flags">Trade-offs:<ul>${p.trade_offs.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : `<div class="muted">No trade-offs.</div>`}
    ${p.approval_needed.length ? `<div class="muted">Agent will declare to the door (→ human approval):<ul>${p.approval_needed.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    <div class="foot"><button onclick="orderPlan(${i}, ${j})">Order this plan</button></div></div>`;
}

function optionCard(o, b) {
  const tags = [];
  if (b.best === o.product_id) tags.push(`<span class="chip accent">★ Top-rated product</span>`);
  if (b.cheapest === o.product_id) tags.push(`<span class="chip">€ Cheapest</span>`);
  if (b.most_reliable === o.product_id) tags.push(`<span class="chip">🚚 Most reliable</span>`);
  if (b.lowest_co2 === o.product_id) tags.push(`<span class="chip">🌱 Lowest CO₂</span>`);
  const statusChip = { in_stock: ["ok", "in Valio stock"], supplier: ["warn", "supplier stock"], partial: ["warn", "partial stock"],
    unavailable: ["bad", "unavailable"], blocked: ["bad", "sales block"], unknown: ["", "not checked"] }[o.status] || ["", o.status];
  return `<div class="opt ${b.best === o.product_id ? "best" : ""}">
    <div class="top"><div><b>${esc(o.name)}</b> <span class="chip ${o.match === "exact" ? "ok" : "warn"}">${esc(o.match)}</span><br>
      <span class="muted">${esc(o.product_id)} · ${o.units_needed ?? "?"} × ${esc(o.sales_unit)} of ${o.content_per_sales_unit ?? "?"} ${esc(o.content_unit)} · ${esc(o.origin)}</span></div>
      <div class="price">${eur(o.total_eur)}<br><span class="muted">${o.comparison_price_eur != null ? eur(o.comparison_price_eur) + "/" + esc(o.content_unit) : ""}</span></div></div>
    <div>${tags.join("")}<span class="chip ${statusChip[0]}">${statusChip[1]}</span>
      <span class="chip ${o.on_time ? "ok" : "bad"}">${o.available_date ? "arrives " + esc(o.available_date) : "no date"}</span>
      <span class="chip">reliability ${o.reliability != null ? Math.round(o.reliability * 1000) / 10 + "%" : "unknown"}</span>
      <span class="chip">${o.co2_kg != null ? o.co2_kg + " kg CO₂e" : "CO₂ unknown"}</span>
      ${o.labels.map(l => `<span class="chip">${esc(l)}</span>`).join("")}</div>
    ${o.flags.length ? `<div class="flags">⚠ ${o.flags.map(esc).join(" · ")}</div>` : ""}
    <details><summary>Why &amp; evidence (score ${o.score})</summary><ul>
      <li>Match: ${esc(o.match_reason)}</li>
      ${Object.entries(o.evidence).map(([k, v]) => `<li>${esc(k)}: ${esc(v)}</li>`).join("")}
      <li>Score parts: price ${o.score_parts.price}, reliability ${o.score_parts.reliability}, CO₂ ${o.score_parts.co2} (weights ${esc(JSON.stringify(o.score_parts.weights))})</li>
      ${o.score_parts.over_order_penalty ? `<li>Over-ordering penalty (whole sales units): −${o.score_parts.over_order_penalty}</li>` : ""}
      ${o.contains_allergens.length ? `<li>Contains: ${esc(o.contains_allergens.join(", "))}</li>` : ""}
      ${o.may_contain_allergens.length ? `<li>May contain: ${esc(o.may_contain_allergens.join(", "))}</li>` : ""}
      ${o.free_from_allergens.length ? `<li>Declared free from: ${esc(o.free_from_allergens.join(", "))}</li>` : ""}
    </ul></details></div>`;
}

function renderLookup(r) {
  last = r;
  if (r.error) { $("result").innerHTML = `<div class="plan">⛔ ${esc(r.error)}</div>`; return; }
  const n = r.need;
  const head = `<div class="muted">Understood by ${esc(n.engine)} · ${r.ai_usage.calls} AI call(s), $${r.ai_usage.usd} ·
    <b>${r.api.products_checked} of ${r.api.catalog_size.toLocaleString("en")} products checked live in ${r.api.calls} API calls</b>
    ${r.live_error ? `<span class="chip bad">${esc(r.live_error)}</span>` : ""}</div>`;
  const parts = r.results.map((res, i) => {
    const it = res.item;
    const need = `<div>${[`${it.quantity} ${it.unit} ${esc(it.label)}`, ...it.must_claims.map(c => c.toLowerCase().replace(/_/g, " ")),
      ...it.exclude_allergens.map(a => "no " + a), ...(it.strict_allergens ? ["strict allergen mode"] : []), `by ${esc(r.deliver_by)}`].map(t => `<span class="chip accent">${t}</span>`).join("")}</div>`;
    const plan = res.plans.length
      ? `<h3>Ways to fulfil this <span class="muted">· ranked by 0.55 × delivery certainty + 0.45 × match fidelity, price breaks ties · the door decides on every order</span></h3>
         <div class="plans">${res.plans.map((p, j) => planCard(p, i, j, it.unit)).join("")}</div>`
      : `<div class="plan"><b>No plan</b><div class="muted">${esc(res.plan.why)}</div></div>`;
    const opts = res.options.map(o => optionCard(o, res.badges)).join("");
    const rej = res.rejected.length ? `<details><summary>Not what you asked for (${res.rejected.length})</summary><ul>${res.rejected.map(x => `<li>${esc(x.name)}: ${esc(x.reason)}</li>`).join("")}</ul></details>` : "";
    return need + funnel(res) + plan + `<h3>Products checked live</h3>` + opts + rej;
  });
  $("result").innerHTML = head + parts.join("<hr>");
}

async function orderPlan(i, j) {
  const res = last.results[i], p = res.plans[j];
  const out = await api("/api/demo/order-plan", { method: "POST", body: JSON.stringify({
    buyer_id: $("buyer").value, deliver_by: last.deliver_by, reason: `${p.label} plan (${p.confidence}). ${p.why}`,
    declared_risks: p.approval_needed,
    lines: p.lines.map(l => ({ product_id: l.product_id, units: l.units, match: l.match })) }) });
  if (out.quote && out.quote.error) alert(out.quote.error);
  refresh();
}

function renderRogue(r) {
  $("result").innerHTML = `<div class="plan"><b>Misbehaving agent (simulation)</b><ul class="lines">${r.steps.map(s =>
    `<li>${esc(s.attempt)} → <b>${esc(s.result.status || (s.result.error ? "refused" : "?"))}</b><div class="muted">${esc(s.result.error || (s.result.policy ? s.result.policy.reasons.join(" ") : ""))}</div></li>`).join("")}</ul>
    <div>${esc(r.answer)}</div></div>`;
}

async function refresh() {
  const [orders, audit, verify, status] = await Promise.all([api("/api/demo/orders"), api("/api/demo/audit"), api("/api/human/audit/verify"), api("/api/demo/status")]);
  $("status").textContent = `AI: ${status.ai_available ? status.ai_model : "offline"} · spent $${status.ai_usage.usd} · Valio API calls: ${status.valio_api.calls}`;
  $("verify").innerHTML = verify.ok ? `<span class="chip ok">chain verified (${verify.entries})</span>` : `<span class="chip bad">chain BROKEN at #${verify.broken_at}</span>`;
  $("orders").innerHTML = orders.length ? orders.map(o => `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin:0"><b>${esc(o.order_id)} · ${eur(o.total_eur)}</b>
        <span class="status-pill ${o.status}">${esc(o.status.replace("_", " "))}</span></div>
      <div class="muted">${esc(o.buyer_name)} · mandate ${esc(o.mandate_id)} · deliver by ${esc(o.deliver_by)}</div>
      <ul class="lines">${o.lines.map(l => `<li>${l.quantity} × ${esc(l.unit)} ${esc(l.name)} · ${eur(l.line_total_eur)} <span class="muted">(${l.stock_source === "supplier" ? "supplier stock" : "Valio stock"})</span></li>`).join("")}</ul>
      <div><b>Agent's reason:</b> ${esc(o.agent_reason)}</div>
      <div class="muted"><b>Door:</b></div><ul class="reasons">${o.policy.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      ${o.status === "pending_approval" ? `
        ${o.approve_by ? `<div class="flags"><b>Approve by ${esc(o.approve_by.replace("T", " "))}</b> to keep the delivery date</div>` : ""}
        <input id="note-${o.order_id}" placeholder="Note (optional)">
        <div class="row"><button onclick="decide('${o.order_id}', true)">Approve</button><button class="danger" onclick="decide('${o.order_id}', false)">Reject</button></div>`
      : `<div class="muted">Decided by: ${esc(o.decided_by)}${o.decision_note ? " — " + esc(o.decision_note) : ""}</div>`}
      ${o.warning ? `<div class="flags">${esc(o.warning)}</div>` : ""}
      ${o.receipt ? `<div class="hash">receipt ${esc(o.receipt.slice(0, 24))}…</div>` : ""}
    </div>`).join("") : `<div class="empty">No orders yet.</div>`;
  $("audit").innerHTML = audit.length ? audit.map(a => `
    <div class="log"><span class="muted">#${a.seq} ${esc(a.at.slice(11))}</span> <span class="who">${esc(a.actor)}</span> ${esc(a.summary)}
      ${a.reason ? `<div class="muted">why: ${esc(a.reason)}</div>` : ""}
      <div class="hash">${esc(a.hash.slice(0, 16))}… ← ${esc(a.prev_hash.slice(0, 8))}…</div></div>`).join("")
    : `<div class="empty">Nothing logged yet.</div>`;
}

async function decide(orderId, approve) {
  try {
    await api(`/api/human/orders/${orderId}/decision`, { method: "POST",
      body: JSON.stringify({ approve, approver: current()?.approver || "Manager", note: $("note-" + orderId)?.value || "" }) });
  } catch (e) { alert(e.message); }
  refresh();
}

async function busy(fn) {
  for (const b of document.querySelectorAll("button")) b.disabled = true;
  $("result").innerHTML = `<div class="muted">Understanding the request, narrowing down 17,546 products, checking the shortlist live…</div>`;
  try { await fn(); } catch (e) { $("result").innerHTML = `<div class="plan">Error: ${esc(e.message)}</div>`; }
  for (const b of document.querySelectorAll("button")) b.disabled = false;
  refresh();
}

$("buyer").onchange = showMandate;
$("send").onclick = () => busy(async () => renderLookup(await api("/api/demo/lookup", { method: "POST", body: JSON.stringify({ buyer_id: $("buyer").value, message: $("msg").value }) })));
$("rogue").onclick = () => busy(async () => renderRogue(await api("/api/demo/rogue", { method: "POST", body: JSON.stringify({ buyer_id: $("buyer").value }) })));
document.querySelectorAll("[data-example]").forEach(b => b.onclick = () => { $("msg").value = b.dataset.example; });
$("reset").onclick = async () => { await api("/api/demo/reset", { method: "POST" }); $("result").innerHTML = ""; await loadBuyers(); refresh(); };

loadBuyers().then(refresh); setInterval(refresh, 4000);
</script>
</body>
</html>
