<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valio Aimo assistant</title>
<link rel="stylesheet" href="/shared.css">
<style>
  .ask textarea { width: 100%; min-height: 56px; resize: vertical; border: none; padding: 4px 0; font-size: 16px; background: transparent; }
  .ask textarea:focus { outline: none; }
  .ask .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .plan { cursor: pointer; text-align: left; display: block; width: 100%; padding: 12px 14px; border-radius: 14px; white-space: normal; }
  .plan.sel { border: 2px solid var(--accent); padding: 11px 13px; background: var(--panel); }
  .plan .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .plan .label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .plan.sel .label { color: var(--accent); }
  .plan .price { font-weight: 700; font-size: 17px; }
  .plan .what { margin: 6px 0 6px; font-size: 14px; }
  .plan .status { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .line { display: flex; gap: 14px; align-items: center; }
  .line + .line { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  .line .name { font-weight: 600; }
  .line .total { font-weight: 700; min-width: 86px; text-align: right; }
  .alts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .alts button { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; }
  .checkout { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  @media (min-height: 860px) { .checkout { position: sticky; bottom: 12px; } }
  .checkout .sum { font-size: 20px; font-weight: 700; }
  .edit { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px 14px; }
  .edit label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .checks label { flex-direction: row; align-items: center; gap: 4px; font-size: 13px; color: var(--ink); }
  .demo { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 10px 12px; margin-top: 18px; font-size: 13px; }
  .funnel span { white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Valio Aimo <span>· buying assistant</span></div>
    <div class="right">
      <select id="buyer" aria-label="Customer"></select>
      <a class="btn" id="ordersLink" href="/orders" target="agentgate-orders">Orders <span class="count" id="waiting" hidden></span></a>
    </div>
  </header>

  <div class="card ask">
    <textarea id="msg" placeholder="I need 1,000 litres of lactose-free milk by Monday, max 1,200 €"></textarea>
    <div class="row" style="justify-content:space-between">
      <div class="hint">Say <b>what</b>, <b>how much</b> and <b>by when</b>. Add diet, allergies, who it's for, a budget and what matters most. English or Finnish.</div>
      <button class="primary" id="find">Find</button>
    </div>
  </div>

  <div id="status" style="margin-top:14px"></div>
  <div id="result"></div>

  <div class="demo" id="demo" hidden>
    <div class="row" style="justify-content:space-between">
      <b>Demo tools</b>
      <div class="row"><button class="small danger" id="rogue">Misbehaving agent</button><button class="small" id="reset">Reset demo</button></div>
    </div>
    <div id="demoOut" class="muted" style="margin-top:8px"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = (v) => v == null ? "–" : v.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const num = (v) => Number(v).toLocaleString("en-GB", { maximumFractionDigits: 2 });
const DEMO = new URLSearchParams(location.search).has("demo");
const CLAIMS = { FREE_FROM_LACTOSE: "Lactose-free", FREE_FROM_GLUTEN: "Gluten-free", VEGAN: "Vegan", FREE_FROM_EGGS: "Egg-free",
  LOW_LACTOSE: "Low-lactose", VEGETARIAN: "Vegetarian", FREE_FROM_SOY: "Soy-free", NO_ADDED_SUGARS: "No added sugar" };
const ALLERGENS = { AM: "milk", AW: "gluten", AE: "egg", AP: "peanuts", AN: "tree nuts", SH: "hazelnut", AY: "soy", AF: "fish", AS: "sesame", AC: "crustaceans" };
const PRIORITY = { price: "Cheapest", reliability: "Most reliable", low_co2: "Lowest CO₂" };

let buyers = [], last = null, itemIdx = 0, planIdx = 0, draft = [], quote = null, quoteTimer = null, quoteSeq = 0, editing = false, sent = null;
const buyerId = () => $("buyer").value;
const res = () => last.results[itemIdx];
const opt = (pid) => res().options.find(o => o.product_id === pid);

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || body.detail || r.statusText);
  return body;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });

function icon(o) { return o && o.content_unit === "KG" ? "🧺" : o && o.content_unit === "PCS" ? "📦" : "🥛"; }
function stock(o) {
  const cls = o.status === "in_stock" ? "ok" : (o.status === "partial" || o.status === "supplier") ? "warn" : "bad";
  return `<span class="dot ${cls}"></span>${esc(o.available_units_text)}`;
}
function dateText(iso) { return iso ? new Date(iso + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "–"; }

// ------------------------------------------------------------------ lookup
async function find(need) {
  const text = $("msg").value.trim();
  if (!text && !need) { $("status").innerHTML = `<div class="banner warn">Say what you need first, for example "24 litres of oat drink by Monday".</div>`; return; }
  $("find").disabled = true; editing = false; sent = null; quote = null;
  $("status").innerHTML = `<div class="banner" style="background:var(--soft)"><div class="spinner"></div>Finding the best way to get it… this takes about 20 seconds.</div>`;
  $("result").innerHTML = "";
  try {
    const r = await post("/api/demo/lookup", { buyer_id: buyerId(), message: text || last?.request || "", need: need || null });
    if (r.error) throw new Error(r.error);
    last = r; itemIdx = 0; $("status").innerHTML = "";
    if (r.live_error) $("status").innerHTML = `<div class="banner bad">Valio's live stock and prices can't be reached right now, so nothing can be confirmed. Try again in a moment.</div>`;
    selectPlan(0);
  } catch (e) {
    $("status").innerHTML = `<div class="banner bad">${esc(e.message)}</div>`;
  }
  $("find").disabled = false;
}

function selectPlan(j) {
  planIdx = j; quote = null; sent = null;
  const p = res().plans[j];
  draft = p ? p.lines.map(l => ({ product_id: l.product_id, units: l.units, match: l.match })) : [];
  render();
  requestQuote();
}

// ------------------------------------------------------------------ render
function render() {
  if (!last) return;
  const r = res();
  $("result").innerHTML = understood() + plansHtml(r) + draftHtml(r) + checkoutHtml();
  if (DEMO) demoStats();
}

function understood() {
  const n = last.need, it = res().item;
  if (editing) return editForm(n, it);
  const chips = [`<span class="pill">${esc(it.label)}</span>`, `<span class="pill">${num(it.quantity)} ${esc(it.unit)}</span>`];
  it.must_claims.forEach(c => chips.push(`<span class="pill">${esc(CLAIMS[c] || c.toLowerCase().replace(/_/g, " "))}</span>`));
  it.exclude_allergens.forEach(a => chips.push(`<span class="pill">No ${esc(ALLERGENS[a] || a)}</span>`));
  if (it.strict_allergens) chips.push(`<span class="pill accent">Strict allergy check</span>`);
  const assumed = (last.assumptions || []).map(a => a.field);
  chips.push(`<span class="pill ${assumed.includes("deliver_by") ? "warn" : ""}">${assumed.includes("deliver_by") ? "⚠ " : ""}By ${dateText(last.deliver_by)}</span>`);
  chips.push(last.budget_eur ? `<span class="pill">Max ${num(last.budget_eur)} €</span>` : `<span class="pill warn">⚠ No budget set</span>`);
  if ((n.priorities || [])[0] && n.priorities[0] !== "price") chips.push(`<span class="pill">${esc(PRIORITY[n.priorities[0]] || n.priorities[0])} first</span>`);
  const items = last.results.length > 1 ? `<div class="row" style="margin-bottom:8px">${last.results.map((x, i) =>
    `<button class="small ${i === itemIdx ? "primary" : ""}" onclick="itemIdx=${i};selectPlan(0)">${esc(x.item.label)}</button>`).join("")}</div>` : "";
  return `<h2>Here's what I understood</h2>${items}<div class="row">${chips.join("")}<button class="ghost" onclick="editing=true;render()">Change</button></div>`;
}

function editForm(n, it) {
  const claimKeys = [...new Set([...Object.keys(CLAIMS).slice(0, 4), ...it.must_claims])];
  const allergenKeys = [...new Set([...Object.keys(ALLERGENS), ...it.exclude_allergens])];
  return `<h2>Change the details</h2><div class="card"><div class="edit">
    <label>Product<input id="e_label" value="${esc(it.label)}"></label>
    <label>Amount<div class="row" style="flex-wrap:nowrap"><input id="e_qty" type="number" min="0" step="any" value="${it.quantity}" class="grow">
      <select id="e_unit">${["L", "KG", "PCS"].map(u => `<option ${u === it.unit ? "selected" : ""}>${u}</option>`).join("")}</select></div></label>
    <label>Deliver by<input id="e_date" type="date" value="${esc(last.deliver_by)}"></label>
    <label>Budget (€, optional)<input id="e_budget" type="number" min="0" step="any" value="${last.budget_eur ?? ""}" placeholder="No limit"></label>
    <label>What matters most<select id="e_prio">${Object.entries(PRIORITY).map(([k, v]) => `<option value="${k}" ${(n.priorities || [])[0] === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
  </div>
  <div style="margin-top:12px" class="muted">Must be</div>
  <div class="checks">${claimKeys.map(c => `<label class="pill"><input type="checkbox" name="claim" value="${c}" ${it.must_claims.includes(c) ? "checked" : ""}>${esc(CLAIMS[c] || c)}</label>`).join("")}</div>
  <div style="margin-top:10px" class="muted">Avoid</div>
  <div class="checks">${allergenKeys.map(a => `<label class="pill"><input type="checkbox" name="allergen" value="${a}" ${it.exclude_allergens.includes(a) ? "checked" : ""}>${esc(ALLERGENS[a] || a)}</label>`).join("")}
    <label class="pill accent"><input type="checkbox" id="e_strict" ${it.strict_allergens ? "checked" : ""}>Strict allergy check (school, hospital)</label></div>
  <div id="e_err" class="muted" style="color:var(--bad);margin-top:8px"></div>
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button onclick="editing=false;render()">Cancel</button><button class="primary" onclick="searchAgain()">Search again</button></div></div>`;
}

function searchAgain() {
  const it = res().item, label = $("e_label").value.trim(), qty = parseFloat($("e_qty").value);
  if (!label) { $("e_err").textContent = "Say which product."; return; }
  if (!(qty > 0)) { $("e_err").textContent = "Enter an amount above 0."; return; }
  const same = label.toLowerCase() === it.label.toLowerCase();
  const item = { ...it, label, quantity: qty, unit: $("e_unit").value,
    product_terms: same ? it.product_terms : label.split(/,| or /).map(s => s.trim()).filter(Boolean),
    substitutes: same ? it.substitutes : [],
    must_claims: [...document.querySelectorAll("input[name=claim]:checked")].map(x => x.value),
    exclude_allergens: [...document.querySelectorAll("input[name=allergen]:checked")].map(x => x.value),
    strict_allergens: $("e_strict").checked };
  const items = last.results.map((x, i) => i === itemIdx ? item : x.item);
  const budget = parseFloat($("e_budget").value);
  find({ ...last.need, items, deliver_by: $("e_date").value || null, budget_eur: budget > 0 ? budget : null,
         priorities: [$("e_prio").value] });
}

function planWhat(p) {
  if (p.kind === "partial") return `Only ${num(p.covered)} ${esc(p.content_unit)} available`;
  const l = p.lines;
  if (l.length === 1) {
    const o = opt(l[0].product_id);
    return `${num(l[0].units)} × ${esc(shortName(l[0].name))}${o && o.content_per_sales_unit ? ` <span class="faint">(${num(o.content_per_sales_unit)} ${esc(o.content_unit)})</span>` : ""}`;
  }
  return `${l.length} products, split`;
}
function shortName(n) { return n.length > 38 ? n.slice(0, 36) + "…" : n; }
function planStatus(p) {
  const exact = p.lines.every(l => l.match === "exact");
  if (p.confidence === "confirmed") return `<span class="dot ok"></span>In Valio stock${exact ? "" : ` · <span class="muted">${p.is_substitute && p.lines.some(l => l.match === "substitute") ? "substitute" : "close variant"}</span>`}`;
  if (p.confidence === "partly confirmed") return `<span class="dot warn"></span>Partly guaranteed`;
  return `<span class="dot warn"></span>Not guaranteed`;
}

function plansHtml(r) {
  if (!r.plans.length) return `<h2>Ways to get it</h2><div class="banner warn">${esc(r.plan.why)}</div>`;
  return `<h2>${r.plans.length === 1 ? "The way to get it" : r.plans.length + " ways to get it"}</h2><div class="plans">${r.plans.map((p, j) => `
    <button class="card plan ${j === planIdx ? "sel" : ""}" onclick="selectPlan(${j})">
      <div class="top"><span class="label">${esc(p.label)}</span><span class="price">${eur(p.total_eur)}</span></div>
      <div class="what">${planWhat(p)}</div>
      <div class="status">${planStatus(p)}</div>
      ${p.over_budget ? `<div class="faint" style="color:var(--bad);margin-top:4px">Over your budget</div>` : ""}
    </button>`).join("")}</div>`;
}

function alternatives(line) {
  const o = opt(line.product_id), inDraft = new Set(draft.map(d => d.product_id));
  return res().options.filter(x => !inDraft.has(x.product_id) && x.on_time && x.unit_price_eur && x.content_per_sales_unit &&
      ["in_stock", "partial", "supplier"].includes(x.status) && x.match !== "different")
    .sort((a, b) => (a.status === "supplier") - (b.status === "supplier") || (a.comparison_price_eur || 1e9) - (b.comparison_price_eur || 1e9))
    .slice(0, 3);
}

function draftHtml(r) {
  if (!draft.length) return "";
  const unit = r.item.unit;
  return `<h2>Your draft order</h2><div class="card">${draft.map((d, k) => {
    const o = opt(d.product_id) || {};
    const content = (o.content_per_sales_unit || 0) * d.units;
    const vat = o.tax_rate != null && o.comparison_price_eur ? ` · ${eur(o.comparison_price_eur * (1 + o.tax_rate / 100))} with VAT` : "";
    const alts = alternatives(d);
    return `<div class="line">
      <div class="thumb">${icon(o)}</div>
      <div class="grow">
        <div class="name">${esc(o.name)}</div>
        <div class="faint">${esc(o.product_id)}${o.brand ? " · " + esc(o.brand) : ""}${o.origin ? " · " + esc(o.origin) : ""}${o.labels && o.labels.length ? " · " + esc(o.labels[0]) : ""}</div>
        <div class="row" style="gap:6px;font-size:13px;margin-top:2px">${stock(o)}</div>
        <div style="font-size:14px;margin-top:2px"><b>${eur(o.comparison_price_eur || o.unit_price_eur)}</b> / ${esc(o.comparison_price_eur ? unit : o.sales_unit)}<span class="faint">${vat}</span></div>
        ${d.match !== "exact" ? `<div class="faint" style="color:var(--warn)">${d.match === "close" ? "Close variant" : "Substitute"}: ${esc(o.match_reason)}</div>` : ""}
        ${alts.length ? `<div class="alts"><span class="faint">Swap for</span>${alts.map(a => `<button onclick="swap(${k}, '${a.product_id}')" title="${esc(a.name)} (${esc(a.available_units_text)})">
          <span class="dot ${a.status === "supplier" || a.status === "partial" ? "warn" : "ok"}"></span>${esc(a.brand || shortName(a.name))} ${num(a.content_per_sales_unit)} ${esc(unit)} pack${a.match !== "exact" ? " (" + esc(a.match === "close" ? "variant" : "substitute") + ")" : ""} · ${eur(a.comparison_price_eur)}/${esc(unit)}</button>`).join("")}</div>` : ""}
        <details class="why"><summary>Where this comes from</summary><ul>${Object.entries(o.evidence || {}).map(([k2, v]) => `<li><b>${esc(k2.replace("_", " "))}:</b> ${esc(v)}</li>`).join("")}
          ${o.contains_allergens && o.contains_allergens.length ? `<li><b>contains:</b> ${esc(o.contains_allergens.join(", "))}</li>` : ""}
          ${o.may_contain_allergens && o.may_contain_allergens.length ? `<li><b>may contain:</b> ${esc(o.may_contain_allergens.join(", "))}</li>` : ""}</ul></details>
      </div>
      <div style="text-align:center">
        <div class="stepper"><button onclick="step(${k},-1)" aria-label="Less">−</button><input type="number" min="0" value="${d.units}" onchange="setUnits(${k}, this.value)" aria-label="Quantity"><button onclick="step(${k},1)" aria-label="More">+</button></div>
        <div class="faint" style="margin-top:4px">${esc(o.sales_unit)}${content ? " · " + num(content) + " " + esc(unit) : ""}</div>
      </div>
      <div class="total">${eur((o.unit_price_eur || 0) * d.units)}</div>
    </div>`;
  }).join("")}</div>`;
}

function checkoutHtml() {
  if (!draft.length) return "";
  if (sent) return `<div style="margin-top:16px">${sent}</div>`;
  const local = draft.reduce((s, d) => s + (opt(d.product_id)?.unit_price_eur || 0) * d.units, 0);
  const covered = draft.reduce((s, d) => s + (opt(d.product_id)?.content_per_sales_unit || 0) * d.units, 0);
  const want = res().item.quantity, unit = res().item.unit;
  const short = unit !== "PCS" && covered < want - 1e-6 ? `<div class="faint" style="color:var(--warn)">This covers ${num(covered)} of the ${num(want)} ${esc(unit)} you asked for.</div>` : "";
  let verdict = `<div class="row muted"><div class="spinner"></div>Checking today's fixed price…</div>`, action = "";
  if (quote && quote.error) verdict = `<div style="color:var(--bad);font-size:14px">${esc(quote.error)}</div>` +
      (res().plans.length > 1 ? `<button class="ghost" onclick="selectPlan(${(planIdx + 1) % res().plans.length})">Try the next way</button>` : "");
  else if (quote) {
    const pv = quote.policy_preview, held = quote.valid_until.slice(11, 16);
    const tags = (pv.tags || []).map(t => `<span class="pill ${pv.decision === "blocked" ? "bad" : "warn"}">${esc(t.text)}</span>`).join("");
    if (pv.decision === "blocked") { verdict = `<div style="color:var(--bad);font-size:14px">Can't be ordered: ${esc(pv.reasons.join(" "))}</div><div class="row" style="margin-top:4px">${tags}</div>`; }
    else if (pv.decision === "needs_human_approval") {
      verdict = `<div class="muted">${esc(pv.approver)} will approve · price held until ${held}</div><div class="row" style="margin-top:4px">${tags}</div>`;
      action = `<button class="primary" onclick="send()">Send for approval</button>`;
    } else {
      verdict = `<div style="color:var(--ok);font-size:14px">Within your rules, the agent can order this now · price held until ${held}</div>`;
      action = `<button class="primary" onclick="send()">Place order</button>`;
    }
  }
  const total = quote && !quote.error ? quote.total_eur : local;
  return `<div class="card checkout" style="margin-top:16px"><div class="grow"><div class="sum">Total ${eur(total)} <span class="faint" style="font-weight:400">excl. VAT</span></div>${short}${verdict}</div>${action}</div>`;
}

// ------------------------------------------------------------------ draft editing
function step(k, by) { setUnits(k, Math.max(0, draft[k].units + by)); }
function setUnits(k, v) {
  const n = Math.max(0, Math.round(Number(v) || 0));
  draft[k].units = n;
  if (!draft.some(d => d.units > 0)) draft[k].units = 1;
  quote = null; sent = null; render(); requestQuote();
}
function swap(k, pid) {
  const old = opt(draft[k].product_id), o = opt(pid);
  const content = (old.content_per_sales_unit || 0) * draft[k].units;
  draft[k] = { product_id: pid, units: Math.max(1, Math.ceil(content / (o.content_per_sales_unit || 1) - 1e-9)), match: o.match };
  quote = null; render(); requestQuote();
}
function requestQuote() {
  clearTimeout(quoteTimer);
  const seq = ++quoteSeq;
  quoteTimer = setTimeout(async () => {
    try { const q = await post("/api/demo/quote", { buyer_id: buyerId(), deliver_by: last.deliver_by, lines: draft.filter(d => d.units > 0),
            is_substitute: draft.some(d => d.match !== "exact"), declared_risks: declaredRisks() }); if (seq === quoteSeq) quote = q; }
    catch (e) { if (seq === quoteSeq) quote = { error: e.message }; }
    if (seq === quoteSeq && !editing) render();
  }, 500);
}
function declaredRisks() { const p = res().plans[planIdx]; return p && !draftChanged() ? p.approval_needed : []; }
function draftChanged() {
  const p = res().plans[planIdx];
  return !p || p.lines.length !== draft.length || p.lines.some((l, i) => l.product_id !== draft[i].product_id || l.units !== draft[i].units);
}
async function send() {
  const p = res().plans[planIdx], changed = draftChanged();
  const reason = `${p.label} plan (${p.confidence}) for ${num(res().item.quantity)} ${res().item.unit} ${res().item.label}. ` +
    (changed ? "The buyer adjusted the products or quantities. " : "") + p.why;
  try {
    const o = await post("/api/demo/order", { buyer_id: buyerId(), quote_id: quote.quote_id, reason,
      is_substitute: draft.some(d => d.match !== "exact"), declared_risks: declaredRisks() });
    if (o.error) throw new Error(o.error);
    const link = `<a href="/orders?buyer=${buyerId()}" target="agentgate-orders">${esc(o.order_id)}</a>`;
    sent = o.status === "confirmed" ? `<div class="banner ok">✓ Order ${link} placed: ${eur(o.total_eur)}, delivery ${dateText(o.deliver_by)}.</div>`
      : o.status === "pending_approval" ? `<div class="banner warn">Sent to the ${esc(o.policy.approver)} for approval: order ${link}, ${eur(o.total_eur)}.${o.approve_by ? ` Approve by ${esc(o.approve_by.replace("T", " "))} to keep the delivery date.` : ""}</div>`
      : `<div class="banner bad">The door rejected order ${link}: ${esc(o.policy.reasons.join(" "))}</div>`;
  } catch (e) { sent = `<div class="banner bad">${esc(e.message)}</div>`; }
  render(); pollOrders();
}

// ------------------------------------------------------------------ orders badge, buyer, demo
async function pollOrders() {
  try {
    const orders = await api(`/api/demo/orders?buyer_id=${buyerId()}`);
    const n = orders.filter(o => o.status === "pending_approval").length;
    $("waiting").hidden = !n; $("waiting").textContent = n + " waiting";
  } catch (e) { /* the badge is a convenience */ }
}
async function loadBuyers() {
  buyers = await api("/api/demo/buyers");
  const want = new URLSearchParams(location.search).get("buyer");
  $("buyer").innerHTML = buyers.map(b => `<option value="${b.buyer_id}" ${b.buyer_id === want ? "selected" : ""}>${esc(b.buyer)}</option>`).join("");
  onBuyer();
}
function onBuyer() { $("ordersLink").href = `/orders?buyer=${buyerId()}`; pollOrders(); }

function demoStats() {
  const r = res(), f = r.funnel;
  $("demoOut").innerHTML = `<div class="funnel">${[`${f.catalog.toLocaleString("en")} products`, ...f.steps.map(s => `${s.remaining} ${esc(s.step)}`),
    `${f.judged} judged by AI`, `${f.checked_live} checked live`].map(s => `<span>${s}</span>`).join(" → ")}</div>
    <div>Understood by ${esc(last.need.engine)} · ${last.ai_usage.calls} AI call(s), $${last.ai_usage.usd} · ${last.api.calls} Valio API call(s) for ${last.api.products_checked} products
    ${f.substitutes_note ? "<br>" + esc(f.substitutes_note) : ""}</div>
    <div>Plan scores: ${r.plans.map(p => `${esc(p.label)} ${p.score} (certainty ${p.certainty}, match ${p.fidelity})`).join(" · ")}</div>`;
}

$("find").onclick = () => find(null);
$("msg").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); find(null); } });
$("buyer").onchange = () => { onBuyer(); if (last && draft.length) { quote = null; sent = null; render(); requestQuote(); } };
if (DEMO) {
  $("demo").hidden = false;
  $("rogue").onclick = async () => {
    $("demoOut").innerHTML = `<div class="row"><div class="spinner"></div>A misbehaving agent is trying to break the rules…</div>`;
    const r = await post("/api/demo/rogue", { buyer_id: buyerId() });
    $("demoOut").innerHTML = `<ul style="margin:0;padding-left:18px">${r.steps.map(s => `<li>${esc(s.attempt)} → <b>${esc(s.result.status || (s.result.error ? "refused" : "?"))}</b>: ${esc(s.result.error || s.result.policy?.reasons.join(" ") || "")}</li>`).join("")}</ul>`;
  };
  $("reset").onclick = async () => { await post("/api/demo/reset", {}); last = null; $("result").innerHTML = ""; $("status").innerHTML = ""; $("demoOut").textContent = "Demo reset."; loadBuyers(); };
}
loadBuyers(); setInterval(pollOrders, 5000);
</script>
</body>
</html>
