<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valio Aimo orders</title>
<link rel="stylesheet" href="/shared.css?v=6">
<style>
  #who { margin-bottom: 4px; }
  /* Each order is a card with a coloured left edge for its status: amber while it waits for a person. */
  .order { margin-bottom: 16px; padding: 20px 24px; border-left: 4px solid var(--line-strong); }
  .order.waiting { border-left-color: var(--warn-edge); }
  .order.ok { border-left-color: var(--ok-dot); }
  .order.bad { border-left-color: var(--bad-dot); }
  .order .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .order .head b { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .order .lines { margin: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .order .ln { display: flex; gap: 12px; align-items: center; font-size: 14.5px; padding: 10px 0; }
  .order .ln + .ln { border-top: 1px solid var(--line); }
  .order .ln .amt { font-weight: 600; white-space: nowrap; }
  .order .ln input { width: 88px; }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .log { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .log:last-child { border-bottom: 0; }
  .log .who { font-weight: 600; font-size: 12.5px; background: var(--primary-soft); color: var(--primary-ink); border-radius: 99px; padding: 2px 10px; }
  .hash { font-family: ui-monospace, monospace; font-size: 12px; color: var(--faint); }
  .set { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
  .set input[type=number] { width: 120px; }
  .agent { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; background: var(--line-strong); border-radius: 99px; transition: background-color .2s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px; background: #fff; border-radius: 50%;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .2); transition: transform .2s; }
  .switch input:checked + span { background: var(--primary); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
  @media (max-width: 560px) { .actions .row { width: 100%; } .actions .row button { flex: 1; } }
  /* Approving is a human's job: the approver signs in with a code the agents don't have. */
  .signin { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 16px 0; border-left: 4px solid var(--primary); }
  .signin > .i { font-size: 28px; color: var(--primary); }
  .signin .grow { min-width: 220px; }
  .signin .row { flex-wrap: nowrap; }
  .signin input { width: 200px; }
  .demo-hint { margin-top: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .demo-hint code { padding: 1px 6px; border-radius: 4px; background: var(--primary-soft, rgba(37, 99, 235, .1)); }
</style>
</head>
<body>
<header class="bar"><div class="in">
  <div class="brand"><i class="i i-package" aria-hidden="true"></i>Valio Aimo<small>orders and approvals</small></div>
  <div class="right">
    <select id="buyer" aria-label="Customer"></select>
    <span class="role hide-sm">Approver</span>
    <span class="avatar" id="avatar" aria-hidden="true"></span>
  </div>
</div></header>
<div class="app">
<nav class="side" aria-label="Sections">
  <a id="buyLink" href="/"><i class="i i-cart" aria-hidden="true"></i>New order</a>
  <button data-tab="waiting" class="on"><i class="i i-circle-alert" aria-hidden="true"></i>Waiting for approval <span class="count" id="nWaiting" hidden></span></button>
  <button data-tab="done"><i class="i i-circle-check" aria-hidden="true"></i>Done</button>
  <button data-tab="history"><i class="i i-history" aria-hidden="true"></i>History</button>
  <button data-tab="settings"><i class="i i-sliders" aria-hidden="true"></i>Agent settings</button>
</nav>
<div class="wrap narrow">
  <h1 id="title">Waiting for approval</h1>
  <div class="muted" id="who"></div>
  <div id="signin"></div>
  <div class="stats" id="stats"></div>
  <div id="msg"></div>
  <div id="view"></div>
</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = (v) => v == null ? "–" : v.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const UNIT_WORDS = { KI: ["case", "cases"], CS: ["case", "cases"], ST: ["piece", "pieces"], KG: ["kg", "kg"], PAK: ["pack", "packs"],
  BAG: ["bag", "bags"], RAS: ["tub", "tubs"], PRK: ["jar", "jars"], BOT: ["bottle", "bottles"], KRT: ["carton", "cartons"],
  PAL: ["pallet", "pallets"], SK: ["sack", "sacks"] };
function unitWord(code, n) {
  const w = UNIT_WORDS[code];
  return w ? `<abbr title="Valio unit code ${esc(code)}" style="text-decoration:none">${n == 1 ? w[0] : w[1]}</abbr>` : esc(code);
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const initials = (s) => String(s || "").replace(/\(.*?\)/g, "").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
const dateText =(iso) => iso ? new Date(iso.slice(0, 10) + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "–";
const STATUS = { pending_approval: ["warn", "Waiting for you"], confirmed: ["ok", "Confirmed"], rejected: ["bad", "Rejected"], cancelled: ["", "Withdrawn"] };
const TAG_ICON = { money: "euro", quantity: "package", delivery: "truck", substitute: "swap", agent: "bot", settings: "shield", food: "ban" };
const ic = (name) => `<i class="i i-${name}" aria-hidden="true"></i>`;

let tab = "waiting", buyers = [], orders = [], editingOrder = null, busy = false;
let approverKey = null, signedIn = false;     // the approver's code, kept in this browser after one sign-in
const buyerId = () => $("buyer").value;
const buyer = () => buyers.find(b => b.buyer_id === buyerId());

async function api(path, opts = {}) {
  // Approver calls carry the approver's code. The door refuses them without it, whatever this page does.
  const key = path.startsWith("/api/human/") && approverKey ? { "X-Approver-Key": approverKey } : {};
  const r = await fetch(path, { headers: { "Content-Type": "application/json", ...key }, ...opts });
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || body.detail || r.statusText);
  return body;
}

// ------------------------------------------------------------------ approver sign-in
const keyName = () => "agentgate-approver:" + buyerId();
const stored = (set) => { try { if (set === undefined) return localStorage.getItem(keyName());
  set === null ? localStorage.removeItem(keyName()) : localStorage.setItem(keyName(), set); } catch (e) { /* private window */ } return null; };
const off = () => signedIn ? "" : "disabled title=\"Sign in as the approver first\"";
async function checkSession() {
  approverKey = stored(); signedIn = false;
  if (approverKey) { try { signedIn = (await api("/api/human/session")).buyer_id === buyerId(); } catch (e) { /* old or wrong code */ } }
  if (!signedIn) approverKey = null;
  drawSignin(); if (tab === "settings") drawSettings(); else draw();
}
function drawSignin() {
  const b = buyer(); if (!b) return;
  $("who").innerHTML = signedIn
    ? `Signed in as ${esc(b.approver)} for ${esc(b.buyer)}. In production this is a notification on your phone. <button class="ghost small" onclick="signOut()">Sign out</button>`
    : `Orders for ${esc(b.buyer)}.`;
  $("signin").innerHTML = signedIn ? "" : `<form class="card signin" onsubmit="signIn(event)"><i class="i i-shield" aria-hidden="true"></i>
      <div class="grow"><b>Sign in to approve</b><div class="muted">Approving is a human's job. It needs the ${esc(b.approver.toLowerCase())}'s code, which the agents don't have.</div>
      ${DEMO_CODES[buyerId()] ? `<div class="demo-hint"><span><b>Demo only:</b> the ${esc(b.approver.toLowerCase())}'s code is <code>${esc(DEMO_CODES[buyerId()])}</code></span>
        <button type="button" class="ghost small" onclick="fillDemoCode()">Fill in</button></div>` : ""}</div>
      <div class="row"><input type="password" id="code" aria-label="Approver code" placeholder="Approver code" autocomplete="off"><button class="primary" id="signinBtn">Sign in</button></div></form>`;
}
// Demo only: the approver codes from data/buyers.json, shown so testers don't have to look them up.
// The API never hands these out, and agent keys are refused on approver calls whatever this page shows.
const DEMO_CODES = { "hotel-aurora": "demo-approver-aurora", "cafe-lumi": "demo-approver-lumi" };
function fillDemoCode() { $("code").value = DEMO_CODES[buyerId()] || ""; $("signinBtn").focus(); }
async function signIn(ev) {
  ev.preventDefault();
  approverKey = $("code").value.trim();
  try {
    if (!approverKey) throw new Error("Type the approver code.");
    const s = await api("/api/human/session");
    if (s.buyer_id !== buyerId()) throw new Error(`That code belongs to ${s.buyer}. Pick that customer at the top first.`);
    stored(approverKey); signedIn = true; flash(`Signed in as ${s.approver}.`);
  } catch (e) { approverKey = null; signedIn = false; flash(e.message === "Unknown approver key." ? "That code isn't right." : e.message, "bad"); }
  drawSignin(); if (tab === "settings") drawSettings(); else draw();
}
function signOut() { stored(null); approverKey = null; signedIn = false; editingOrder = null; drawSignin(); if (tab === "settings") drawSettings(); else draw(); }
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });
function flash(text, cls = "ok") { $("msg").innerHTML = `<div class="banner ${cls}" style="margin-bottom:12px">${esc(text)}</div>`; setTimeout(() => $("msg").innerHTML = "", 5000); }

// ------------------------------------------------------------------ orders
function tagsHtml(o) {
  return (o.policy.tags || []).map(t => `<span class="pill ${o.policy.decision === "blocked" ? "bad" : "warn"}">${TAG_ICON[t.kind] ? ic(TAG_ICON[t.kind]) : ""}${esc(t.text)}</span>`).join("");
}
function notesHtml(o) {
  return (o.notes || []).length ? `<div style="font-size:15px;margin:4px 0 2px">${ic("note")} <b>Buyer's wishes:</b> ${o.notes.map(esc).join("; ")}</div>` : "";
}
function orderCard(o) {
  const [cls, label] = STATUS[o.status] || ["", o.status];
  const waiting = o.status === "pending_approval", editing = editingOrder === o.order_id;
  const lines = o.lines.map((l, k) => `<div class="ln">
      <div class="thumb sm">${l.image_url ? `<img src="${esc(l.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<span class="pk">${l.content && l.quantity ? `<b>${(l.content / l.quantity).toLocaleString("en-GB", { maximumFractionDigits: 1 })} ${esc(l.content_unit)}</b><small>per ${unitWord(l.unit, 1)}</small>` : `<b>${unitWord(l.unit, 1)}</b>`}</span></div>
      <div class="grow">${editing ? `<input type="number" min="0" value="${l.quantity}" data-k="${k}" aria-label="Quantity"> ${unitWord(l.unit, 2)} of` : `<b>${l.quantity} ${unitWord(l.unit, l.quantity)}</b> of`} ${esc(l.name)}
        <div class="faint" style="display:flex;gap:12px;flex-wrap:wrap">${l.content ? `<span>${Math.round(l.content).toLocaleString("en-GB")} ${esc(l.content_unit)} in total</span>` : ""}<span>${l.stock_source === "supplier" ? "From the supplier" : "Valio stock"}</span>${l.price_basis ? `<span>${esc(cap(l.price_basis))}</span>` : ""}</div></div>
      <div class="amt">${eur(l.line_total_eur)}</div></div>`).join("");
  let foot = "";
  if (waiting && editing) {
    foot = `<div class="actions"><span class="muted">Change the amounts. The new total is priced live and still checked against your rules.</span>
      <div class="row"><button onclick="editingOrder=null;draw()">Cancel</button><button class="primary" ${off()} onclick="approveChanged('${o.order_id}')">Approve with changes</button></div></div>`;
  } else if (waiting) {
    foot = `${notesHtml(o)}<div class="muted" style="margin-top:6px">Why it needs you</div><div class="row" style="margin-top:4px">${tagsHtml(o)}</div>
      <details class="why"><summary>Full reasons</summary><ul>${o.policy.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        <div style="margin-top:6px"><b>Agent's reason:</b> ${esc(o.agent_reason)}</div></details>
      <div class="actions">
        <span style="font-size:14px;color:var(--warn)">${o.approve_by ? `${ic("clock")} Approve by ${esc(o.approve_by.replace("T", " "))} to keep the delivery date` : ""}</span>
        <div class="row"><button class="small ghost" ${off()} onclick="withdraw('${o.order_id}')">Withdraw</button>
          <button ${off()} onclick="decide('${o.order_id}', false)">Reject</button>
          <button ${off()} onclick="editingOrder='${o.order_id}';draw()">Change</button>
          <button class="primary" ${off()} onclick="decide('${o.order_id}', true)">Approve</button></div>
      </div>`;
  } else {
    const by = o.status === "confirmed" && o.decided_by === "door (automatic)" ? "Ordered by the agent within your rules" :
      o.decided_by ? `${o.status === "cancelled" ? "Withdrawn" : o.status === "rejected" && o.decided_by.startsWith("door") ? "Stopped by Valio's rules" : "Decided"} by ${esc(o.decided_by)}` : "";
    foot = `${notesHtml(o)}<div class="faint" style="margin-top:6px">${by}${o.changed_by ? ` · amounts changed (was ${eur(o.original_total_eur)})` : ""}${o.decision_note ? ` · “${esc(o.decision_note)}”` : ""}
      ${o.receipt ? ` · receipt <span class="hash">${esc(o.receipt.slice(0, 12))}…</span>` : ""}</div>
      ${o.status === "rejected" && o.policy.decision === "blocked" ? `<div class="row" style="margin-top:4px">${tagsHtml(o)}</div>` : ""}
      ${o.warning ? `<div class="faint" style="color:var(--warn)">${esc(o.warning)}</div>` : ""}`;
  }
  return `<div class="card order ${waiting ? "waiting" : cls}">
    <div class="head"><div><b>${eur(o.total_eur)}</b> <span class="faint" style="margin-left:8px">Order ${esc(o.order_id)}, delivery ${dateText(o.deliver_by)}</span></div>
      <span class="pill ${cls}">${label}</span></div>
    <div class="lines">${lines}</div>${foot}</div>`;
}

async function decide(id, approve) {
  const note = approve ? "" : (prompt("Why are you rejecting it? (optional)") ?? null);
  if (note === null) return;
  try { await post(`/api/human/orders/${id}/decision`, { approve, approver: buyer().approver, note }); flash(approve ? `${id} approved.` : `${id} rejected.`, approve ? "ok" : "warn"); }
  catch (e) { flash(e.message, "bad"); }
  load();
}
async function approveChanged(id) {
  const o = orders.find(x => x.order_id === id);
  const changes = [...document.querySelectorAll(`input[data-k]`)].map(i => ({ product_id: o.lines[+i.dataset.k].product_id, quantity: Math.max(0, Number(i.value) || 0) }));
  if (!changes.some(c => c.quantity > 0)) { flash("Keep at least one product, or reject the order.", "bad"); return; }
  try { const r = await post(`/api/human/orders/${id}/decision`, { approve: true, approver: buyer().approver, note: "Approved with changed amounts", changes });
        editingOrder = null; flash(`${id} approved with changes: ${eur(r.total_eur)}.`); }
  catch (e) { flash(e.message, "bad"); }
  load();
}
async function withdraw(id) {
  try { await post(`/api/human/orders/${id}/cancel`, { by: buyer().approver }); flash(`${id} withdrawn.`, "warn"); } catch (e) { flash(e.message, "bad"); }
  load();
}

// ------------------------------------------------------------------ history and settings
async function drawHistory() {
  const [audit, verify] = await Promise.all([api("/api/demo/audit"), api("/api/human/audit/verify")]);
  const mine = audit.filter(a => a.actor.endsWith(buyerId()) || a.actor.startsWith("human:"));
  $("view").innerHTML = `<div class="banner ${verify.ok ? "ok" : "bad"}" style="margin-bottom:10px">${verify.ok
      ? `History verified: ${verify.entries} entries, none changed afterwards.` : `History was changed at entry #${verify.broken_at}.`}</div>
    <div class="card">${mine.length ? mine.map(a => `<div class="log"><span class="faint">#${a.seq} ${esc(a.at.replace("T", " ").slice(5, 16))}</span>
      <span class="who">${esc(a.actor)}</span> ${esc(a.summary)}${a.reason ? `<div class="faint">why: ${esc(a.reason)}</div>` : ""}</div>`).join("")
      : `<div class="empty">Nothing has happened yet.</div>`}</div>`;
}

function drawSettings() {
  const m = buyer();
  $("view").innerHTML = `<div class="card"><div class="set">
      <div><b>Always ask me</b><div class="muted">Every order waits for the ${esc(m.approver)}, even small ones.</div></div>
      <label class="switch"><input type="checkbox" id="s_always" ${m.always_ask ? "checked" : ""}><span></span></label>
      <div><b>Agent may order alone up to</b><div class="muted">Only used when "Always ask me" is off. Orders must also be normal amounts.</div></div>
      <div class="row"><input type="number" id="s_auto" min="0" value="${m.auto_approve_limit_eur}"> €</div>
      <div><b>Never above</b><div class="muted">Orders over this are blocked, even with approval.</div></div>
      <div class="row"><input type="number" id="s_hard" min="1" value="${m.hard_limit_eur}"> €</div>
      <div><b>Delivery within</b></div>
      <div class="row"><input type="number" id="s_lead" min="1" value="${m.max_lead_time_days}"> days</div>
    </div>
    <div class="faint" style="margin-top:12px">Food only · substitutes always need approval · over ${m.unusual_order_factor}× your usual week needs approval
      (${Object.values(m.usual_weekly || {}).map(u => `${u.quantity} ${u.unit} ${u.name}`).join(", ")})</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="primary" ${off()} onclick="saveSettings()">Save</button></div></div>
    <h2>Connected agents</h2>
    <div class="card">${m.agents.map(a => `<div class="agent"><div><b>${esc(a.name)}</b>
        <div class="faint">${a.paused ? "Paused: every request is refused" : "Active"}</div></div>
      <button class="${a.paused ? "primary" : "danger"} small" ${off()} onclick="togglePause('${a.id}', ${!a.paused})">${a.paused ? "Resume" : "Pause"}</button></div>`).join("")}
      <div class="faint" style="margin-top:8px">Pausing one agent stops it at Valio's door at once. Your other agents keep working.</div></div>`;
}
async function saveSettings() {
  try {
    await post(`/api/human/mandates/${buyerId()}/settings`, { by: buyer().approver, always_ask: $("s_always").checked,
      auto_approve_limit_eur: Number($("s_auto").value), hard_limit_eur: Number($("s_hard").value), max_lead_time_days: Number($("s_lead").value) });
    flash("Settings saved."); await loadBuyers();
  } catch (e) { flash(e.message, "bad"); }
}
async function togglePause(agentId, pause) {
  try { await post(`/api/human/agents/${buyerId()}/${agentId}/${pause ? "pause" : "resume"}`, { by: buyer().approver }); await loadBuyers(); }
  catch (e) { flash(e.message, "bad"); }
}

// ------------------------------------------------------------------ main
function draw() {
  const waiting = orders.filter(o => o.status === "pending_approval");
  $("nWaiting").hidden = !waiting.length; $("nWaiting").textContent = waiting.length;
  const n = (st) => orders.filter(o => o.status === st).length;
  $("stats").innerHTML = tab === "waiting" || tab === "done" ? [["Waiting for you", waiting.length, "circle-alert", "warn"],
      ["Confirmed", n("confirmed"), "circle-check", "ok"], ["Rejected or stopped", n("rejected"), "ban", "bad"]].map(([label, v, icon, cls]) =>
    `<div class="card stat"><div><div class="muted">${label}</div><b>${v}</b></div><i class="i i-${icon} ${cls}" aria-hidden="true"></i></div>`).join("") : "";
  if (tab === "waiting") $("view").innerHTML = waiting.length ? waiting.map(orderCard).join("") : `<div class="empty">Nothing is waiting for you.</div>`;
  if (tab === "done") { const done = orders.filter(o => o.status !== "pending_approval");
    $("view").innerHTML = done.length ? done.map(orderCard).join("") : `<div class="empty">No finished orders yet.</div>`; }
}
async function load() {
  if (busy) return;
  busy = true;
  try {
    orders = await api(`/api/demo/orders?buyer_id=${buyerId()}`);
    const b = buyer();
    if (tab === "waiting" || tab === "done") { if (!editingOrder && !document.activeElement?.matches("input")) draw(); else $("nWaiting").textContent = orders.filter(o => o.status === "pending_approval").length; }
    if (tab === "history") await drawHistory();
  } catch (e) { flash(e.message, "bad"); }
  busy = false;
}
async function loadBuyers() {
  const sel = $("buyer").value || new URLSearchParams(location.search).get("buyer");
  buyers = await api("/api/demo/buyers");
  $("buyer").innerHTML = buyers.map(b => `<option value="${b.buyer_id}" ${b.buyer_id === sel ? "selected" : ""}>${esc(b.buyer)}</option>`).join("");
  if (tab === "settings") drawSettings();
}
// The sidebar is the navigation: each section is a view of this page, and the address keeps which one (#done, #history, ...).
const TITLES = { waiting: "Waiting for approval", done: "Done", history: "History", settings: "Agent settings" };
function setTab(name) {
  tab = name in TITLES ? name : "waiting"; editingOrder = null;
  document.querySelectorAll(".side [data-tab]").forEach(x => { const on = x.dataset.tab === tab; x.classList.toggle("on", on);
    if (on) x.setAttribute("aria-current", "page"); else x.removeAttribute("aria-current"); });
  $("title").textContent = TITLES[tab];
  if (tab === "settings") { $("stats").innerHTML = ""; if (buyer()) drawSettings(); } else { if (tab === "history") $("view").innerHTML = ""; draw(); load(); }
}
function onBuyer() { const b = buyer(); $("buyLink").href = `/?buyer=${buyerId()}`; $("avatar").textContent = b ? initials(b.approver) : ""; checkSession(); }
document.querySelectorAll(".side [data-tab]").forEach(b => b.onclick = () => {
  history.replaceState(null, "", `/orders?buyer=${buyerId()}#${b.dataset.tab}`); setTab(b.dataset.tab); });
window.addEventListener("hashchange", () => setTab(location.hash.slice(1)));
$("buyer").onchange = () => { editingOrder = null; onBuyer(); if (tab === "settings") drawSettings(); load(); history.replaceState(null, "", `/orders?buyer=${buyerId()}#${tab}`); };
loadBuyers().then(() => { onBuyer(); setTab(location.hash.slice(1)); }); setInterval(() => { if (tab !== "settings") load(); }, 4000);
</script>
</body>
</html>
